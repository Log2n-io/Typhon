\* GENUINENESS mutant: register after the draw: a reader whose snapshot is above the stamp finds no card and misses the commit. TLC MUST report a violation.
\* Run: ./run-tlc.sh CommitStamp mutant-registerafterdraw --expect-violation
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 1
  Handlers = {1}
  Mutant = "registerafterdraw"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
INVARIANT RepeatableRead
INVARIANT AtomicVisibility
INVARIANT Causality
INVARIANT NoDirtyRead
INVARIANT GCSafety
