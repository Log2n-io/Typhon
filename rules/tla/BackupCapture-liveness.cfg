\* Liveness bound: two writers, one capture (full: the first always is), one version per page and one LSN, under weak fairness
\* of every progress step and no timeout. One capture holds every abort path (~200 K states, ~20 s on 32 threads).
CONSTANTS
  Pages = {1, 2}
  Writers = {1, 2}
  MaxVersion = 1
  MaxLsn = 1
  MaxCaptures = 1
  Mutant = "none"

SPECIFICATION FairSpec

INVARIANT TypeOK
INVARIANT HookNotRemovedUnderWriter

PROPERTY WritersProgress
PROPERTY GateReopens
