\* MVCC option C, family 1 (plan 06 step 3.0), the merge gate's bound: 2 writers x 2 entities x 1 reader (two rounds) +
\* the GC, one card (Size = 1: every committer collides, a card is reused — ABA reachable), writer 1 on the handler path
\* (holds its chain locks from PREPARE to PUBLISH).  Expects GREEN, and no deadlock.  The plan's full bound, 2 readers, is
\* CommitStamp-full.cfg; two committers in flight at once, CommitStamp-twoslots.cfg.
