\* GENUINENESS mutant (BKP-12): the hook is removed (and its memory freed) without draining the writers inside the gate, one of
\* which may be about to run it. TLC MUST report HookNotRemovedUnderWriter.
\* Run: ./run-tlc.sh BackupCapture mutant-uninstallnogate --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "uninstallnogate"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
INVARIANT HookNotRemovedUnderWriter
