\* GENUINENESS mutant: the walker takes the last visible revision in chain order, not the highest stamp. TLC MUST report a violation.
\* Run: ./run-tlc.sh CommitStamp mutant-chainorder --expect-violation
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 2
  Handlers = {}
  Mutant = "chainorder"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
INVARIANT RepeatableRead
INVARIANT AtomicVisibility
INVARIANT Causality
INVARIANT NoDirtyRead
INVARIANT GCSafety
