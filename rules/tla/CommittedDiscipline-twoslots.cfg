\* The two commits write different slots and run concurrently, so one can publish and withdraw its floor while the other is
\* still between its append and its publish: the cycle must cap at the lowest floor, not the latest.
\* Run: ./run-tlc.sh CommittedDiscipline twoslots
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  SameSlot = FALSE
  BreakStaging = FALSE
  FloorMutant = "none"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT CK13_BelowUnpublished
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges

PROPERTY CK13_NeverLowers
