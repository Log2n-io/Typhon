\* GENUINENESS mutant: the stamp drawn before APPEND, which may still fail: a reader takes the registered commit, which then aborts. TLC MUST report a violation.
\* Run: ./run-tlc.sh CommitStamp mutant-drawbeforeappend --expect-violation
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 1
  Handlers = {1}
  Mutant = "drawbeforeappend"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
INVARIANT RepeatableRead
INVARIANT AtomicVisibility
INVARIANT Causality
INVARIANT NoDirtyRead
INVARIANT GCSafety
