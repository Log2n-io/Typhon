\* GENUINENESS mutant (BKP-10): the open reclaims below CheckpointLSN, ignoring the floor, as an archiving-off open does. TLC MUST report ArchivedOrReleased.
\* Run: ./run-tlc.sh WalArchive mutant-openreclaim --expect-violation
CONSTANTS
  MaxLsn = 4
  MaxCrashes = 1
  Mutant = "openreclaim"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ArchivedOrReleased
INVARIANT FloorHoldsUnarchived
INVARIANT FloorAtArchiveEnd
INVARIANT NoSilentHole
