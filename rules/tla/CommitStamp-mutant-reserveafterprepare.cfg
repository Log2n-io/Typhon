\* GENUINENESS mutant: the reservation after PREPARE: the handler-path writer waits for the card holding its chain locks, and the card's owner waits for them. TLC MUST report a violation.
\* Run: ./run-tlc.sh CommitStamp mutant-reserveafterprepare --expect-violation
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 1
  Handlers = {1}
  Mutant = "reserveafterprepare"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
INVARIANT RepeatableRead
INVARIANT AtomicVisibility
INVARIANT Causality
INVARIANT NoDirtyRead
INVARIANT GCSafety
