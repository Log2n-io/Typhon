\* GENUINENESS mutant: the reservation leaves the previous owner's Stamp: a reader between register and store reads it. TLC MUST report a violation.
\* Run: ./run-tlc.sh CommitStamp mutant-nostampreset --expect-violation
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 1
  Handlers = {1}
  Mutant = "nostampreset"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
INVARIANT RepeatableRead
INVARIANT AtomicVisibility
INVARIANT Causality
INVARIANT NoDirtyRead
INVARIANT GCSafety
