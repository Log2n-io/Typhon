\* GENUINENESS mutant (BKP-12, liveness): a freeze whose bounded acquire times out does not reopen the gate. No writer enters
\* again once the last capture has ended. TLC MUST report GateReopens.
\* Run: ./run-tlc.sh BackupCapture mutant-timeoutkeepsgate --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 1
  MaxLsn = 1
  MaxCaptures = 1
  Mutant = "timeoutkeepsgate"

SPECIFICATION FairSpec

INVARIANT TypeOK

PROPERTY GateReopens
