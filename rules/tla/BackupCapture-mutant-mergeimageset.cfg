\* GENUINENESS mutant (BKP-07): an abort merges back the capture's image set instead of the map the freeze detached. A full
\* capture's image set is every page in the model, but null in the code, so the mutant merges nothing for it: a page written
\* before the freeze is lost to the next incremental. TLC MUST report ChangeMapComplete.
\* Run: ./run-tlc.sh BackupCapture mutant-mergeimageset --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "mergeimageset"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
INVARIANT HookNotRemovedUnderWriter
