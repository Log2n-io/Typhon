\* GENUINENESS mutant (CK-13): the commit withdraws its floor before its publish instead of after. A cycle between the two
\* sees no floor and passes the record. TLC MUST report CK13_BelowUnpublished.
\* Run: ./run-tlc.sh CommittedDiscipline mutant-withdrawearly --expect-violation
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  SameSlot = TRUE
  BreakStaging = FALSE
  FloorMutant = "withdrawearly"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT CK13_BelowUnpublished
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges
