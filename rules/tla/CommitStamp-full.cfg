\* MVCC option C, family 1 — the plan's full bound: 2 writers x 2 entities x 2 readers (2 rounds each) + the GC, one
\* card (Size = 1), writer 1 on the handler path.  GREEN, 88.6 M distinct states, ~10 min on 32 threads: too long for the
\* merge gate, which skips *-full.cfg; run it locally after any change to the spec or the protocol.
