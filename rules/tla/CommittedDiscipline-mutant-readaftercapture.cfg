\* GENUINENESS mutant (CK-13): the cycle reads the floors after its capture instead of before. A commit that publishes and
\* withdraws in between has its effect missing from the capture and its floor gone from the read. TLC MUST report a
\* violation: AckDurable once a crash recovers without the lost write.
\* Run: ./run-tlc.sh CommittedDiscipline mutant-readaftercapture --expect-violation
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  SameSlot = TRUE
  BreakStaging = FALSE
  FloorMutant = "readaftercapture"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT CK13_BelowUnpublished
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges
