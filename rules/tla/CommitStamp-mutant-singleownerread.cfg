\* GENUINENESS mutant: no second Owner read: a reader takes the stamp of the card's next owner. TLC MUST report a violation.
\* Run: ./run-tlc.sh CommitStamp mutant-singleownerread --expect-violation
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 1
  Handlers = {1}
  Mutant = "singleownerread"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
INVARIANT RepeatableRead
INVARIANT AtomicVisibility
INVARIANT Causality
INVARIANT NoDirtyRead
INVARIANT GCSafety
