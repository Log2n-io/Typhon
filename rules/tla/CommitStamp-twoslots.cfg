\* Two cards: two committers in flight at once, their chain order and stamp order free to differ; no handler path (it
\* would serialize them on the chain locks).  Expects GREEN.
\* Run: ./run-tlc.sh CommitStamp twoslots
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 2
  Handlers = {}
  Mutant = "none"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
INVARIANT RepeatableRead
INVARIANT AtomicVisibility
INVARIANT Causality
INVARIANT NoDirtyRead
INVARIANT GCSafety
