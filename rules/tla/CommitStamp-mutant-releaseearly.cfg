\* GENUINENESS mutant: the card released after the first publish: a reader finds one revision published, the other flagged with no card. TLC MUST report a violation.
\* Run: ./run-tlc.sh CommitStamp mutant-releaseearly --expect-violation
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 1
  Handlers = {1}
  Mutant = "releaseearly"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
INVARIANT RepeatableRead
INVARIANT AtomicVisibility
INVARIANT Causality
INVARIANT NoDirtyRead
INVARIANT GCSafety
