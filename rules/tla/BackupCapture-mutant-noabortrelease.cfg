\* GENUINENESS mutant (BKP-12, liveness): an abort does not release a writer waiting on a page the scanner claimed. The scanner
\* has stopped, so the page is never done; the writer holds the gate the uninstall drains: neither moves again. TLC MUST report
\* WritersProgress (deadlock checking is off, so the run reaches the temporal check rather than stopping at the deadlock).
\* Run: ./run-tlc.sh BackupCapture mutant-noabortrelease --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 1
  MaxLsn = 1
  MaxCaptures = 1
  Mutant = "noabortrelease"

SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT HookNotRemovedUnderWriter

PROPERTY WritersProgress
