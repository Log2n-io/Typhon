\* GENUINENESS mutant: BreakStaging = TRUE injects Variant B (in-place write).
\* Stage writes the HEAD `live` BEFORE the commit record is appended, so a
\* fuzzy Checkpoint can persist an uncommitted value. TLC MUST report a
\* violation of CM01_HeadCommitted (immediately) / CM01_NoUncommittedDurable
\* (after a checkpoint) — proving Variant A (staging) is WHY CM-01 holds, the
\* D7 rationale. Run: ./run-tlc.sh CommittedDiscipline mutant --expect-violation
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  BreakStaging = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges
