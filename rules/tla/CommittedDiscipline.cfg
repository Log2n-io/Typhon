\* Model bounds (design 08 §6 budget: <= 3 pages, <= 2 txs, <= 2 background threads, < 10^7 states).
\* SameSlot = TRUE: both commits write the one slot, serialized as the runtime DAG serializes same-entity writers.
\* CommittedDiscipline-twoslots.cfg runs them concurrently on two slots.
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  SameSlot = TRUE
  BreakStaging = FALSE
  FloorMutant = "none"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT CK13_BelowUnpublished
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges

PROPERTY CK13_NeverLowers
