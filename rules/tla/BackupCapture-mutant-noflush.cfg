\* GENUINENESS mutant (BKP-04, C1): the tail is copied without waiting for the freeze's published LSN to be durable, so a page
\* written before flush2 reflects a record the tail lacks. TLC MUST report TailCoversImage.
\* Run: ./run-tlc.sh BackupCapture mutant-noflush --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "noflush"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
