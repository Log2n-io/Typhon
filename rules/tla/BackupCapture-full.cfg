\* Exhaustive bound past the gate's budget: the default's two writers on two pages, with two versions per page (32 M distinct
\* states up to writer permutation, ~80 s on 32 threads). Skipped by CI (-full); run locally after any change to the spec.
CONSTANTS
  Pages = {1, 2}
  Writers = {w1, w2}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "none"

SPECIFICATION Spec
SYMMETRY WriterSymmetry

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
INVARIANT HookNotRemovedUnderWriter
