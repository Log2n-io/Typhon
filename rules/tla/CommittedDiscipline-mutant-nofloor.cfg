\* GENUINENESS mutant (CK-13): the cycle ignores the floors, as before CK-13 (NEW-CK-1). A cycle whose barrier covers a
\* commit that has appended but not published moves CheckpointLSN onto its record, and recovery then skips it.
\* TLC MUST report CK13_BelowUnpublished (and, after a crash, AckDurable).
\* Run: ./run-tlc.sh CommittedDiscipline mutant-nofloor --expect-violation
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  SameSlot = TRUE
  BreakStaging = FALSE
  FloorMutant = "nofloor"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT CK13_BelowUnpublished
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges
