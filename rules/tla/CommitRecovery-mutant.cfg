\* GENUINENESS mutant: BreakMarkerGate = TRUE drops the commit-marker condition
\* in ApplyStep, so recovery applies UNCOMMITTED data. TLC MUST report a
\* violation of LOG04_MarkerGates / EndStateEqCommittedPrefix — proving the gate
\* (LOG-04) actually bites. Run: ./run-tlc.sh CommitRecovery mutant --expect-violation
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  BreakMarkerGate = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT EndStateEqCommittedPrefix
INVARIANT LOG04_MarkerGates
INVARIANT LOG05_DurableHonest
INVARIANT AP01_AppendBeforePublish
INVARIANT AP02_PointOfNoReturn
INVARIANT AP12_ApplyIdempotent
