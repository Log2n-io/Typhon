\* GENUINENESS mutant: the GC keyed by TSN: the sentinel is the highest-identity revision, and the highest-stamp one a snapshot needs is freed. TLC MUST report a violation.
\* Run: ./run-tlc.sh CommitStamp mutant-gcbytsn --expect-violation
CONSTANTS
  NumW = 2
  NumR = 1
  NumE = 2
  NumSlots = 1
  Handlers = {1}
  Mutant = "gcbytsn"
  SecondRound = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SnapshotRead
