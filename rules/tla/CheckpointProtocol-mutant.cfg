\* GENUINENESS mutant: BreakCoverageGate = TRUE makes CoverageGate advance
\* CheckpointLSN even when pages were SKIPPED. A skipped (dirty, uncaptured) page's
\* WAL record is then recycled while its content is not in the base -> TLC MUST
\* report NoLostPage violated, proving the coverage gate (CK-03) bites.
\* Run: ./run-tlc.sh CheckpointProtocol mutant --expect-violation
CONSTANTS
  NumPages = 2
  MaxLsn = 3
  MaxCrashes = 2
  BreakCoverageGate = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CK01_BarrierDurable
INVARIANT CK02_CapturedSubsetDurable
INVARIANT CK04_RecycleBound
INVARIANT NoLostPage
