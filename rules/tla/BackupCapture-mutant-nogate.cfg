\* GENUINENESS mutant (BKP-01/02): writers ignore the freeze and the freeze ignores writers in flight, so a write whose map bit
\* went into the detached set lands after the freeze: the next incremental loses it. TLC MUST report ChangeMapComplete (other
\* paths of the same mutant break ImageFidelity).
\* Run: ./run-tlc.sh BackupCapture mutant-nogate --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "nogate"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
