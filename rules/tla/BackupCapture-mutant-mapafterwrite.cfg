\* GENUINENESS mutant (BKP-01): the change-map bit is set after the write, outside the gate, so a freeze in between detaches
\* a map without the page. TLC MUST report ChangeMapComplete.
\* Run: ./run-tlc.sh BackupCapture mutant-mapafterwrite --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "mapafterwrite"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
