\* Model bounds (design 08 §6 budget: <= 3 pages, <= 2 writers): two pages, two writers (the writer-writer claim, a writer held
\* by the scanner's claim, a writer holding the gate an uninstall waits for), two captures (a full, then an incremental), writers
\* checked up to permutation (model values). Liveness is BackupCapture-liveness.cfg's: TLC's symmetry is unsound for it.
CONSTANTS
  Pages = {1, 2}
  Writers = {w1, w2}
  MaxVersion = 1
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "none"

SPECIFICATION Spec
SYMMETRY WriterSymmetry

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
INVARIANT HookNotRemovedUnderWriter
