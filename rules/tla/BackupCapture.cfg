\* Model bounds (design 08 §6 budget: <= 3 pages, <= 2 writers, < 10^7 states): two pages, one writer (a second only adds the writer-writer claim, one atomic step here), two captures.
\* BackupCapture-full.cfg adds a third page (run locally; the gate keeps this bound).
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "none"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
