\* GENUINENESS mutant (BKP-04, W1): the freeze sets no reclaim floor, so a checkpoint between the freeze and the tail copy
\* reclaims records the tail needs. TLC MUST report NoNeededRecordReclaimed (and TailCoversImage).
\* Run: ./run-tlc.sh BackupCapture mutant-nofloor --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "nofloor"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
