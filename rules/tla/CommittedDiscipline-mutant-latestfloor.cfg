\* GENUINENESS mutant (CK-13): the cycle caps at the highest floor instead of the lowest. On two slots both commits can be
\* between their append and their publish at once; capping at the later one passes the earlier one's record.
\* TLC MUST report CK13_BelowUnpublished. Run: ./run-tlc.sh CommittedDiscipline mutant-latestfloor --expect-violation
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  SameSlot = FALSE
  BreakStaging = FALSE
  FloorMutant = "latestfloor"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT CK13_BelowUnpublished
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges
