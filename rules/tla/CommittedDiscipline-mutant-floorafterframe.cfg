\* GENUINENESS mutant (CK-13): the commit stores its floor after publishing its WAL frame instead of before. The writer can
\* drain the frame and a barrier cover it before the floor is visible. TLC MUST report CK13_BelowUnpublished.
\* Run: ./run-tlc.sh CommittedDiscipline mutant-floorafterframe --expect-violation
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  SameSlot = TRUE
  BreakStaging = FALSE
  FloorMutant = "floorafterframe"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT CK13_BelowUnpublished
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges
