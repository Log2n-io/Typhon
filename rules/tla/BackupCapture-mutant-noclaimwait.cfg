\* GENUINENESS mutant (BKP-03): a writer finding a page the scanner claimed but has not read writes anyway; the scanner then
\* reads the post-freeze bytes. TLC MUST report ImageFidelity.
\* Run: ./run-tlc.sh BackupCapture mutant-noclaimwait --expect-violation
CONSTANTS
  Pages = {1, 2}
  Writers = {1}
  MaxVersion = 2
  MaxLsn = 2
  MaxCaptures = 2
  Mutant = "noclaimwait"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChangeMapComplete
INVARIANT ImageFidelity
INVARIANT TailCoversImage
INVARIANT NoNeededRecordReclaimed
