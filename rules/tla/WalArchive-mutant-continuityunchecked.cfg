\* GENUINENESS mutant (BKP-10): a restore trusts the archive's end instead of deriving its continuity from the files. TLC MUST report NoSilentHole.
\* Run: ./run-tlc.sh WalArchive mutant-continuityunchecked --expect-violation
CONSTANTS
  MaxLsn = 4
  MaxCrashes = 1
  Mutant = "continuityunchecked"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ArchivedOrReleased
INVARIANT FloorHoldsUnarchived
INVARIANT FloorAtArchiveEnd
INVARIANT NoSilentHole
