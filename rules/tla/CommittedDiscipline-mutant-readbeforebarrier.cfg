\* GENUINENESS mutant (CK-13): the cycle reads the floors before its barrier instead of after. A commit that claims and
\* drains in between is covered by the barrier but not by the floor read. TLC MUST report CK13_BelowUnpublished.
\* Run: ./run-tlc.sh CommittedDiscipline mutant-readbeforebarrier --expect-violation
CONSTANTS
  NumTx = 2
  MaxCrashes = 2
  SameSlot = TRUE
  BreakStaging = FALSE
  FloorMutant = "readbeforebarrier"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CM01_HeadCommitted
INVARIANT CM01_NoUncommittedDurable
INVARIANT AP01_PublishAfterAppend
INVARIANT CK13_BelowUnpublished
INVARIANT AckDurable
INVARIANT CM03_RecoveryConverges
