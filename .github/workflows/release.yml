name: Release

# Packs and publishes everything Typhon ships, at ONE version (07-delivery § 5):
#   NuGet — `Typhon` (the engine), `Typhon.Cli` (the tool), `Typhon.Protocol`, `Typhon.Client`, `Typhon.Subscriptions.AspNetCore` (+ symbols);
#   npm   — `@typhondb/client` (the TypeScript SDK);
#   GitHub Release — the native C SDK, prebuilt per platform (static + shared library, headers, CMake package), and the other artifacts.
# Triggered by pushing a prerelease-shaped tag (e.g. `1.0.0-alpha.1`) or a manual dispatch. Each publish runs behind a GitHub environment
# approval and uses keyless OIDC trusted publishing — no stored API key. Nothing publishes until every package's smoke test passed.
# Design + rationale: claude/scratch/distribution-packaging-plan-2026-07-06.md §3 (#430), Feature #435; claude/design/Subscriptions/07 § 5 (#1044).
#
# ────────────────────────────────────────────────────────────────────────────────────────────────────────────
# OWNER-ONLY PROVISIONING (must exist before the first publish — I can't do these):
#   1. A nuget.org account (or Organization) that will own the IDs. The first successful publish creates an unclaimed ID under the pushing owner.
#   2. ONE NuGet Trusted Publishing policy (nuget.org → your username → Trusted Publishing → Add). A policy is
#      OWNER-scoped — it covers ALL packages owned by the chosen owner, so one policy publishes every ID. Fields:
#      Policy Owner = you (individual) or the Log2n organization; Repository Owner `log2n-io`; Repository `Typhon`;
#      Workflow File `release.yml` (file name only, no path); Environment `nuget-release`.
#      ⚠ For a PRIVATE repo the policy is *pending-active for 7 days* until the FIRST successful publish locks
#        the repo/owner IDs — do a real publish within 7 days of creating it (restartable anytime).
#   3. A repository secret `NUGET_USER` = the nuget.org username of the person who CREATED the policy (NOT the
#      policy owner, NOT an email). Even for an ORG-owned policy this is the individual creator's personal username
#      — nuget.org's token exchange keys on the creator ("No matching trust policy owned by user 'X'" if wrong).
#      MFA does not affect OIDC publishing (keyless — MFA only gates interactive login). A wrong value 401s at the
#      login step BEFORE the push, so no version is consumed — just fix the secret and re-run the failed job.
#   4. A GitHub environment named `nuget-release` with a required reviewer (this is the approval gate) — create it
#      BEFORE the first run, or GitHub auto-creates it unprotected and the publish proceeds without approval.
#   5. npm: the `typhondb` organization (scope `@typhondb`), and a GitHub environment `npm-release` with a required reviewer.
#      npm trusted publishing is configured PER PACKAGE (npmjs.com → package → Settings → Trusted Publisher: GitHub Actions, `log2n-io/Typhon`,
#      workflow `release.yml`, environment `npm-release`), so it cannot exist before the package does. The FIRST publish therefore uses a token:
#      a repository secret `NPM_TOKEN` (a granular token with publish rights on @typhondb). Once the package exists, add the trusted publisher
#      and delete the secret — the job then publishes keyless, with provenance.
# Until 1.0.0, PRERELEASE-ONLY: the version must carry a `-<label>` (`-alpha.N`, `-beta.N`, `-rc.N`). Cutting 1.0.0 is a deliberate act —
# remove the "Enforce prerelease-only" guard below.
# ────────────────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      # Prerelease-shaped tags only: the literal `-` requires a prerelease label, so a bare/stable tag
      # (e.g. `0.0.1`) never triggers a publish. The guard step below is the authoritative enforcement.
      - '*.*.*-*'
  workflow_dispatch:

# Least privilege by default; each publish job opts into `id-token: write` for OIDC.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Pack every .NET package and the TypeScript SDK at one version, enforce prerelease-only, and gate on the smoke tests. ----
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer derives the version from git tags/height — it needs full history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Node: the CLI pack builds the Workbench SPA (the BuildClientApp MSBuild target shells out to npm) so `typhon ui` ships wwwroot,
      # and the TypeScript SDK is built and packed here.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Deterministic client install (lockfile-exact). The subsequent CLI pack's BuildClientApp target then builds
      # the SPA into wwwroot from this node_modules.
      - name: Restore Workbench client (npm ci)
        working-directory: tools/Typhon.Workbench/ClientApp
        run: npm ci

      # ContinuousIntegrationBuild=true makes the build deterministic + normalises Source Link paths. Symbols
      # (.snupkg) + package validation are configured in Directory.Build.props / each csproj.
      - name: Pack the .NET packages
        run: |
          set -euo pipefail
          for project in \
              src/Typhon.Protocol/Typhon.Protocol.csproj \
              src/Typhon.Engine/Typhon.Engine.csproj \
              src/Typhon.Client/Typhon.Client.csproj \
              src/Typhon.Subscriptions.AspNetCore/Typhon.Subscriptions.AspNetCore.csproj \
              src/Typhon.Shell/Typhon.Shell.csproj; do
            dotnet pack "$project" -c Release -p:ContinuousIntegrationBuild=true -o artifacts
          done

      # Derive the shipped version from the produced engine nupkg (authoritative — MinVer sets it in a build
      # target, so it can't be read via evaluation), then FAIL if it has no `-<label>` prerelease segment. This is
      # belt-and-suspenders over the tag filter and also covers workflow_dispatch (height-based MinVer versions).
      - name: Enforce prerelease-only
        id: version
        run: |
          set -euo pipefail
          NUPKG=$(ls artifacts/Typhon.[0-9]*.nupkg | grep -v '\.snupkg$' | head -1)
          VERSION=$(basename "$NUPKG" | sed -E 's/^Typhon\.(.*)\.nupkg$/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "::notice::prerelease OK: $VERSION" ;;
            *)   echo "::error::Version '$VERSION' is a STABLE release; until 1.0.0 releases are prerelease-only. Remove this guard deliberately to cut a stable release."; exit 1 ;;
          esac

      # One version for everything (07 § 5): every .NET package carries the engine's version, or the release stops here.
      - name: Assert one version across packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for id in Typhon Typhon.Cli Typhon.Protocol Typhon.Client Typhon.Subscriptions.AspNetCore; do
            [ -f "artifacts/$id.$VERSION.nupkg" ] || { echo "::error::$id.$VERSION.nupkg missing: every package ships at one version"; ls artifacts; exit 1; }
          done
          [ "$(ls artifacts/*.nupkg | wc -l)" -eq 5 ] || { echo "::error::expected exactly 5 nupkgs"; ls artifacts; exit 1; }

      # The TypeScript SDK, stamped with the same version (the repository keeps 0.0.0) and packed into artifacts/.
      - name: Pack the TypeScript SDK (@typhondb/client)
        working-directory: src/Typhon.Client.TypeScript
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pack --pack-destination ../../artifacts
          ls ../../artifacts/typhondb-client-"$VERSION".tgz

      # The anti-"packaging silently broke" gates: prove the engine package's generator fires in a real consumer
      # build, and that the CLI tool installs + runs. A broken package fails here, before publish.
      - name: Consumer smoke test (engine package)
        run: bash scripts/consumer-smoke-test.sh artifacts

      - name: CLI tool smoke test (Typhon.Cli)
        run: bash scripts/cli-tool-smoke-test.sh artifacts

      # The onboarding-loop gate: install the packed CLI, `typhon new`, and `dotnet run` the scaffold against the
      # packed engine — all from the local feed. Fails the release (blocking publish) if the scaffold pins an engine
      # version other than the one being shipped, or if the emitted template won't compile/run against it. This is
      # the exact co-published-pair coherence check the other two smoke tests don't cover.
      - name: Onboarding-loop smoke test (typhon new → dotnet run)
        run: bash scripts/onboarding-smoke-test.sh artifacts

      # The client side: a Protocol-only contracts assembly (its generator), a server on Typhon + Typhon.Subscriptions.AspNetCore, the .NET
      # client over TCP and the TypeScript tarball over WebSocket — each must hold the server's entities.
      - name: Subscriptions smoke test (Protocol, Client, AspNetCore, TypeScript)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/subscription-smoke-test.py artifacts --ts-tarball "artifacts/typhondb-client-$VERSION.tgz"

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.tgz
          if-no-files-found: error

  # ---- The native C SDK, prebuilt per platform at the same version: static + shared library, headers, CMake package (no TLS/WebSocket). ----
  native:
    needs: pack
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-26.04, archive: tar.gz }
          - { name: windows-x64, os: windows-latest, archive: zip }
          - { name: macos-arm64, os: macos-latest, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build, test, install
        shell: bash
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          CORE="${VERSION%%-*}"       # CMake versions are numeric: 1.0.0 of 1.0.0-alpha.1; the archive carries the full one
          cmake -S src/Typhon.Client.Native -B build -DCMAKE_BUILD_TYPE=Release -DTYPHON_VERSION="$CORE" -DTYPHON_NATIVE_SHARED=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release --prefix "typhon-client-native-$VERSION-${{ matrix.name }}"

      # The installed package as a consumer sees it: find_package(TyphonClient), linked static and shared, run.
      - name: Native package smoke test
        shell: bash
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: $(command -v python3 || command -v python) scripts/native-package-smoke-test.py "typhon-client-native-$VERSION-${{ matrix.name }}"

      - name: Archive
        shell: bash
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          DIR="typhon-client-native-$VERSION-${{ matrix.name }}"
          mkdir -p native-artifacts
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "native-artifacts/$DIR.zip" "$DIR" > /dev/null
          else
            tar -czf "native-artifacts/$DIR.tar.gz" "$DIR"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.name }}
          path: native-artifacts/*
          if-no-files-found: error

  # ---- Publish to NuGet.org behind an environment approval, using keyless OIDC (no stored API key). ----
  publish:
    needs: [pack, native]
    runs-on: ubuntu-latest
    environment: nuget-release        # required-reviewer approval gate (owner-configured)
    permissions:
      contents: read
      id-token: write                 # lets GitHub mint the OIDC token NuGet/login exchanges for a short-lived key
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Exchanges the GitHub OIDC token for a short-lived (~1h) nuget.org API key via Trusted Publishing.
      # Requires the Trusted Publishing policy + NUGET_USER secret from the provisioning checklist above.
      - name: NuGet Trusted Publishing login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes packages AND symbols (.snupkg) in one glob. Typhon.Protocol first: the others depend on it, and a consumer restoring in the window
      # between two pushes should not meet a package whose dependency is not there yet. --skip-duplicate makes a re-run idempotent.
      - name: Push to NuGet.org
        env:
          KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          push() { dotnet nuget push "$1" --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate; }
          push "artifacts/Typhon.Protocol.*.nupkg"
          for f in artifacts/*.nupkg; do
            case "$f" in artifacts/Typhon.Protocol.*) ;; *) push "$f" ;; esac
          done

  # ---- Publish @typhondb/client to npm behind an environment approval: OIDC trusted publishing (with provenance), or NPM_TOKEN for the first. ----
  npm-publish:
    needs: [pack, native, publish]
    runs-on: ubuntu-latest
    environment: npm-release          # required-reviewer approval gate (owner-configured)
    permissions:
      contents: read
      id-token: write                 # OIDC trusted publishing, and npm's provenance attestation
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts

      # Trusted publishing needs npm ≥ 11.5.1 and Node ≥ 22.14.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          # Empty once the trusted publisher is configured: npm then exchanges the OIDC token itself.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g npm@latest
          # Idempotent: a re-run after a later job failed must not fail here.
          if npm view "@typhondb/client@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@typhondb/client@$VERSION is already published"
            exit 0
          fi
          # The dist-tag is the prerelease label — `alpha`, `beta`, `rc` — so `npm install @typhondb/client@beta` follows the line, and `latest`
          # stays unset until 1.0.0.
          DIST_TAG=$(echo "$VERSION" | sed -E 's/^[^-]+-([A-Za-z]+).*$/\1/')
          # `./` is load-bearing: without it npm reads `artifacts/<file>` as a GitHub `user/repo` shorthand and, with git sources disabled by default
          # (EALLOWGIT), refuses it. The first 1.0.0-alpha.1 run failed exactly there.
          npm publish "./artifacts/typhondb-client-$VERSION.tgz" --access public --tag "$DIST_TAG"

  # ---- A GitHub Release for the tag: the native SDK archives (its only distribution), and every other artifact beside them. ----
  github-release:
    needs: [pack, native, publish, npm-publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* -R "$GITHUB_REPOSITORY" --prerelease --title "Typhon $TAG" --generate-notes
          fi
