name: Coverage

# OPT-IN, NON-blocking code coverage — same model as the Benchmark workflow. Never gates a merge.
# Triggers: add the `run-coverage` label to a PR, or run manually.
# Coverage is hardware-independent, so CI commits the refreshed report directly.
# Design: claude/design/Infrastructure/ci-merge-gate.md

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]            # fires once when the `run-coverage` label is added

permissions:
  contents: write              # commit the refreshed coverage report + history

jobs:
  coverage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-coverage'
    runs-on: ubuntu-latest
    # ---- COST FAIL-SAFE (#729, 2026-08-09). ----
    # `sky launch` holds a billed VM for exactly as long as this job runs, and an uncapped job inherits GitHub's
    # 360-minute default — so a hang here strands a c6id.8xlarge for six hours. Opt-in-only triggers make that unlikely,
    # not impossible, and the cost of being wrong is the whole point of capping it.
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install SkyPilot
        run: python3 -m pip install --quiet "skypilot[aws]"

      - name: Run coverage on c6id
        timeout-minutes: 40
        run: sky launch bench/aws/coverage.sky.yaml -c typhon-coverage-${{ github.run_id }} --down -y --env RUN_ID=${{ github.run_id }}

      # `--down` sets AUTODOWN, which the skylet executes ON THE VM — it is not a teardown issued from this runner. So it
      # needs ec2:TerminateInstances in the *instance role*, and it is silently a no-op when the VM cannot terminate
      # itself: #971 scoped that away and left three c6id boxes running for hours. This step is the backstop, and it has
      # to work without SkyPilot's cooperation — `sky down` needs sky's local state, which a cancelled or timed-out job
      # may never have written, while the tag filter needs nothing but the API.
      #
      # It replaces `sky down -y <task name>`, which never matched anything: that name is the *task* name inside the
      # .sky.yaml, while `sky launch` without `-c` generates a cluster called `sky-<hash>-<user>`. The step printed
      # "Cluster(s) not found" on every run it ever made, including the ones it existed to protect. `-c` on the launch
      # is what makes the name ours and this step able to name it.
      - name: Tear down the VM (always, including on timeout or cancel)
        if: always()
        run: |
          set -uo pipefail
          CLUSTER='typhon-coverage-${{ github.run_id }}'
          # The API sweep runs FIRST, deliberately. It needs nothing but credentials, finishes in seconds, and works
          # when sky's local state was never written (a launch killed between RunInstances and its bookkeeping).
          # `sky down` needs that state and can take minutes, so on a cancellation it can eat the whole grace window
          # and leave the box running. Terminating out from under sky is safe — it then finds the instances gone.
          #
          # Two exact tag values rather than one prefix glob: `<cluster>*` would also match a run whose id is this
          # one with more digits, and killing a concurrent run's VM is a worse failure than missing one.
          TAGF="Name=tag:skypilot-cluster-name,Values=${CLUSTER},${CLUSTER}-*"
          STATEF="Name=instance-state-name,Values=pending,running,stopping,stopped"
          Q='Reservations[].Instances[].InstanceId'
          ids=$(aws ec2 describe-instances --region eu-west-1 --filters "$TAGF" "$STATEF" --query "$Q" --output text || true)
          if [ -n "${ids:-}" ]; then
            echo "::warning::terminating instances left for ${CLUSTER}: ${ids}"
            aws ec2 terminate-instances --region eu-west-1 --instance-ids ${ids} >/dev/null || true
          fi
          timeout 120 sky down -y "$CLUSTER" || true

      - name: Pull results from S3
        if: always()
        run: |
          mkdir -p cov-out
          aws s3 sync "s3://typhon-traces/coverage/${{ github.run_id }}/" cov-out/ || true

      - name: Render report on the check page
        if: always()
        run: |
          if [ -f cov-out/reports/latest.md ]; then
            cat cov-out/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No coverage report produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit refreshed coverage report
        if: success()
        run: |
          [ -f cov-out/results.jsonl ] || { echo "no results to commit"; exit 0; }
          cp cov-out/results.jsonl coverage/history/results.jsonl
          rm -rf coverage/reports
          mkdir -p coverage/reports
          cp -r cov-out/reports/. coverage/reports/
          git config user.name  "typhon-coverage-bot"
          git config user.email "noreply@typhondb.io"
          git add coverage/history/results.jsonl coverage/reports
          if git diff --cached --quiet; then
            echo "No coverage changes to commit."
          else
            git commit -m "coverage: record coverage run [skip ci]"
            git push
          fi
