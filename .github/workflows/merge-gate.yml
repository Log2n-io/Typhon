name: Merge Gate

# The single required PR check. Detects changed areas, runs the heavy correctness suites on an
# ephemeral c6id.8xlarge via SkyPilot (engine / workbench / coverage) and the TLA+ specs on a free
# runner, then an aggregate `gate` job reports one definitive green/red.
# Design + rationale: claude/design/Infrastructure/ci-merge-gate.md
#
# Folds in the retired engine-ci.yml + workbench-ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Back-to-back pushes within a PR cancel the older run instead of queueing.
concurrency:
  group: merge-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Change detection: emit boolean flags consumed by the heavy jobs + passed to the VM. ----
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      workbench: ${{ steps.filter.outputs.workbench }}
      tla: ${{ steps.filter.outputs.tla }}
      rules: ${{ steps.filter.outputs.rules }}
      # `[no-ut]` in the PR head commit message → skip the heavy aws-gate suites (self-declared small-fix bypass).
      skip_ut: ${{ steps.ut.outputs.skip_ut }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine:
              - 'src/Typhon.Engine/**'
              - 'test/Typhon.Engine.Tests/**'
            workbench:
              - 'tools/Typhon.Workbench/**'
            tla:
              - 'src/Typhon.Engine/Durability/**'
            # #703: re-audit when a rule CITATION or the audit itself changes. The rule database
            # lives in the private repo, so its own edits cannot trigger this — the nightly
            # doc-drift job in that repo covers that direction.
            rules:
              - 'test/**/*.cs'
              - 'scripts/audit-rule-coverage.py'
              - 'scripts/tests/**'
              - 'coverage/rule-coverage-baseline.json'

      # Opt-out for genuine small fixes: `[no-ut]` in the head commit message skips the heavy aws-gate
      # unit-test suites. Reads pull_request.head.sha (NOT the working-tree HEAD — on a PR that is the
      # synthetic merge commit, whose auto-message never carries the token); falls back to github.sha on push.
      - name: Detect [no-ut] skip token
        id: ut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          MSG=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '.commit.message')
          if grep -qiE '\[no-ut\]' <<<"$MSG"; then
            echo "skip_ut=true" >> "$GITHUB_OUTPUT"
            echo "::notice::[no-ut] found in $SHA — skipping the aws-gate unit-test suites."
          else
            echo "skip_ut=false" >> "$GITHUB_OUTPUT"
          fi

  # ---- Heavy correctness suites on the c6id (engine / workbench / coverage). ----
  aws-gate:
    needs: changes
    # Default (SkyPilot ephemeral) path — skipped when the persistent self-hosted runner is enabled (repo variable
    # GATE_RUNNER=selfhosted, #466); the aws-gate-selfhosted job below runs instead. Rollback = unset the variable.
    if: >-
      (needs.changes.outputs.engine == 'true' || needs.changes.outputs.workbench == 'true')
      && needs.changes.outputs.skip_ut != 'true'
      && vars.GATE_RUNNER != 'selfhosted'
    runs-on: ubuntu-latest
    # ---- COST FAIL-SAFE (#729, 2026-08-09). ----
    # Same exposure as the self-hosted job below, by a different route: `sky launch` holds a billed VM for as long as this
    # step runs, so an uncapped step meant an uncapped VM. The step budget is larger than the self-hosted one because it
    # also pays for cold provisioning (image pull + boot), which the warm persistent box does not.
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v5

      - name: Install SkyPilot
        run: python3 -m pip install --quiet "skypilot[aws]"

      # Blocking launch: sky propagates the VM's run: exit code, so a test failure on the VM
      # fails this step → this job → the gate. --down tears the instance down either way.
      - name: Run correctness gate on c6id
        timeout-minutes: 25
        run: |
          sky launch bench/aws/ci.sky.yaml --down -y \
            --env RUN_ENGINE=${{ needs.changes.outputs.engine }} \
            --env RUN_WORKBENCH=${{ needs.changes.outputs.workbench }} \
            --env RUN_ID=${{ github.run_id }}

      # `--down` only tears the cluster down on a normal exit. A step timeout or a cancelled run kills sky mid-flight and
      # strands the VM — billing with nothing watching it. This runs on every path, including cancellation, and is a no-op
      # when the cluster is already gone.
      - name: Tear down the VM (always, including on timeout or cancel)
        if: always()
        run: sky down -y typhon-ci-gate || true

      # if: always() — we want the report surfaced precisely when the gate FAILED.
      - name: Pull reports from S3
        if: always()
        run: |
          mkdir -p ci-out
          aws s3 sync "s3://typhon-traces/ci/${{ github.run_id }}/" ci-out/ || true

      - name: Render report on the check page
        if: always()
        run: |
          if [ -f ci-out/summary.md ]; then
            cat ci-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No summary produced (the VM may have failed before writing one)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw artifacts (.trx / coverage / logs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports
          path: ci-out/**
          if-no-files-found: ignore

  # ---- Same gate, on the PERSISTENT self-hosted c6id (repo variable GATE_RUNNER=selfhosted). DORMANT until the
  #      box + power-toggle exist — see bench/aws/runner/ + design/Infrastructure/ci-gate-persistent-runner.md (#466).
  #      Warm toolchain + bin/obj on the box → incremental build; test DBs on the local NVMe (TMPDIR=/nvme). ----
  aws-gate-selfhosted:
    needs: changes
    if: >-
      (needs.changes.outputs.engine == 'true' || needs.changes.outputs.workbench == 'true')
      && needs.changes.outputs.skip_ut != 'true'
      && vars.GATE_RUNNER == 'selfhosted'
    runs-on: [self-hosted, linux, typhon-c6id]
    # ---- COST FAIL-SAFE (#729, 2026-08-09). ----
    # This job runs on a BILLED, always-on instance, and it had no timeout at all — so it inherited GitHub's 360-minute
    # default. A gate that hung held the box for six hours; one that did so overnight would hold it for six hours before
    # anyone saw it. This was the only workflow in the repo with no cap, and the only one that costs money per minute.
    #
    # The suite is 2-3 minutes healthy and 5 is already abnormal, so 10 on the step is a generous ceiling that still
    # bounds the damage to roughly one suite's worth of compute. The job gets a slightly larger cap so the step timeout
    # fires FIRST: that way the `if: always()` report and artifact steps still run and the .trx says where it hung,
    # rather than the whole job being killed with no evidence of why.
    timeout-minutes: 15
    steps:
      # clean:false keeps the warm bin/obj (untracked) for an incremental build; test DBs live on /nvme (TMPDIR),
      # not the worktree, so nothing accumulates there. git reset --hard reverts any tracked edits for isolation.
      - name: Checkout (keep warm bin/obj)
        uses: actions/checkout@v5
        with:
          clean: false
      - name: Run correctness gate on the persistent c6id
        timeout-minutes: 10
        env:
          RUN_ENGINE: ${{ needs.changes.outputs.engine }}
          RUN_WORKBENCH: ${{ needs.changes.outputs.workbench }}
          RUN_ID: ${{ github.run_id }}
          TMPDIR: /nvme
        run: |
          git reset --hard HEAD
          OUT="$(pwd)/ci-out" REPO="$(pwd)" bash bench/aws/run-gate.sh
      - name: Render report on the check page
        if: always()
        run: |
          if [ -f ci-out/summary.md ]; then
            cat ci-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No summary produced (the gate may have failed before writing one)._" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw artifacts (.trx / coverage / logs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports
          path: ci-out/**
          if-no-files-found: ignore

  # ---- TLA+ specs on a free runner (Java only — must NOT consume the c6id). ----
  tla:
    needs: changes
    if: ${{ needs.changes.outputs.tla == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The specs live in the separate typhon-claude repo (claude/ is gitignored here).
      - name: Checkout typhon-claude (TLA specs)
        uses: actions/checkout@v5
        with:
          repository: Log2n-io/Typhon-Claude
          # Cross-repo private checkout: the default GITHUB_TOKEN is scoped to this repo only and 404s on Typhon-Claude.
          # A fine-grained PAT (Contents:read on Typhon-Claude) resolves the ref and auths the fetch. ref pins to main.
          ref: main
          token: ${{ secrets.TYPHON_CLAUDE_TOKEN }}
          path: typhon-claude

      # Same reasoning as the rule-coverage job below: a PR that changes a TLA spec and the code it models spans
      # both repos on same-named branches, and pinning `main` here would model-check the OLD spec against the NEW
      # code. It has not bitten yet only because no PR has changed a spec and its implementation together.
      - name: Prefer the PR's companion docs branch, if it exists
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        working-directory: typhon-claude
        run: |
          set -uo pipefail
          branch='${{ github.head_ref }}'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$branch"
            git checkout -q FETCH_HEAD
            echo "specs: typhon-claude branch '$branch' @ $(git rev-parse --short HEAD)"
          else
            echo "specs: typhon-claude main @ $(git rev-parse --short HEAD) (no branch '$branch' there)"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'    # runs the pinned tla2tools v1.7.4

      - name: Model-check all specs + genuineness mutants
        # Typhon-Claude's repo root IS the claude/ content, so the specs sit at rules/tla (no extra claude/ segment).
        working-directory: typhon-claude/rules/tla
        run: |
          set -e
          # Invoke via `bash` (not ./) so a missing exec bit — common when the script is committed from Windows —
          # doesn't fail the run with "Permission denied".
          for spec in CheckpointProtocol CommitRecovery CommittedDiscipline; do
            echo "::group::TLC $spec (expect GREEN)"
            bash run-tlc.sh "$spec"
            echo "::endgroup::"
            echo "::group::TLC $spec mutant (expect VIOLATION)"
            bash run-tlc.sh "$spec" mutant --expect-violation
            echo "::endgroup::"
          done

  # ---- Rule-coverage audit on a free runner (#703 Part 2). ----
  #
  # Cross-checks `claude/rules/*.md` against the tests that claim to verify them, in BOTH directions, and ratchets
  # the counts so a verifier cannot be quietly deleted. It fails on: a duplicate rule id (README requires ids unique
  # across the whole database — `CX-01..05` were defined twice with different meanings until #703), a `verified:`
  # naming a test that does not exist, a [VerifiesRule] naming a rule that does not exist, and any DECREASE in
  # coverage. A verifier with no [RuleMutant] is reported, not blocking — see the audit's own docstring for why
  # forcing 15 mutants in one push would move the dishonesty rather than remove it.
  #
  # Shaped exactly like the `tla` job below-left: the rules live in the PRIVATE Typhon-Claude repo, so this needs
  # the PAT and is path-gated to keep it off unrelated PRs. `--skip-if-no-rules` makes a fork PR (where GitHub
  # withholds the secret, so the checkout produces nothing) SKIP loudly rather than red-out — and the skip message
  # says the run proves nothing, so it cannot be mistaken for a pass.
  rule-coverage:
    needs: changes
    if: ${{ needs.changes.outputs.rules == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout typhon-claude (rule database)
        continue-on-error: true    # fork PRs get no secret; the audit then skips rather than failing the gate
        uses: actions/checkout@v5
        with:
          repository: Log2n-io/Typhon-Claude
          ref: main
          token: ${{ secrets.TYPHON_CLAUDE_TOKEN }}
          path: typhon-claude

      # A change that adds a RULE and the test that verifies it spans both repos, and the two halves travel on
      # branches of the same name. Auditing against `main` compares this PR's code to rules that do not yet contain
      # its changes, which makes the pair un-mergeable in either order: the code PR stays red until the docs PR
      # merges, and the docs PR has no gate of its own to show it is safe to merge first. #705 hit exactly this —
      # a new rule (RB-06) and its [VerifiesRule] test, reported as "names a rule that does not exist".
      #
      # The fallback is announced rather than silent: a green run must say WHICH rules it audited, or it cannot be
      # told apart from a green run that audited the wrong ones.
      - name: Prefer the PR's companion docs branch, if it exists
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true      # no checkout on a fork PR — the audit's own --skip-if-no-rules handles that
        working-directory: typhon-claude
        run: |
          set -uo pipefail
          branch='${{ github.head_ref }}'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$branch"
            git checkout -q FETCH_HEAD
            echo "rules: typhon-claude branch '$branch' @ $(git rev-parse --short HEAD)"
          else
            echo "rules: typhon-claude main @ $(git rev-parse --short HEAD) (no branch '$branch' there)"
          fi

      - name: Audit rule coverage + ratchet
        run: |
          python3 scripts/audit-rule-coverage.py \
            --rules-dir typhon-claude/rules \
            --skip-if-no-rules

      # The audit is itself tested — planted duplicate id, planted dangling `verified:`, planted always-green
      # verifier, planted ratchet regression. An audit that has never rejected anything is the same false green it
      # exists to remove. Runs unconditionally: it needs no rules checkout and no secret.
      - name: Audit self-tests
        run: python3 -m unittest discover -s scripts/tests -v

  # ---- Cheap source-invariant gate on a free runner (must NOT consume the c6id). ----
  #
  # LOG-02 "single codec". `overview/06-durability.md` and rule LOG-02 both claimed RecordCodec exclusivity
  # was "grep-gated". Verified 2026-07-28: no such check existed in any of the 12 workflows — only §7.1 of
  # the design (storage-layer identifier names) was ever built. The greppable proxy for "record bytes are
  # written only by RecordCodec" is the byte-offset layout: anyone hand-rolling a record needs RecordFormat's
  # offsets, so referencing that type outside Durability/internals/ is the tell. Green as of 2026-07-29 —
  # this locks in a property that currently holds rather than announcing an aspiration.
  #
  # DELIBERATELY self-contained: no secret, no cross-repo checkout, nothing but this repo's own source.
  # An earlier revision also ran the claude/ doc-drift lint here, which required checking out the PRIVATE
  # Typhon-Claude repo with a PAT. That was wrong on two counts:
  #   * GitHub withholds secrets from pull_request runs originating in a FORK, so the checkout 404s and the
  #     gate reds out every outside contribution. This repo has 18 forks and has already taken one fork PR.
  #   * A PAT in a public repo's CI is a capability, not a fence: anyone with push access here could print
  #     the private knowledge base from a workflow step.
  # The doc↔code comparison now runs the other way round — a nightly job in the PRIVATE claude repo pulling
  # the PUBLIC code, needing no credential at all. See typhon-claude/.github/workflows/doc-drift.yml.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: LOG-02 — record byte layout stays inside Durability/internals/
        run: |
          set -uo pipefail
          # -P for a real word boundary; exclude the owning folder, which is the whole point of the rule.
          hits=$(grep -rnP '\bRecordFormat\b' --include='*.cs' src/ tools/ 2>/dev/null \
                   | grep -v 'Durability/internals/' || true)
          if [ -n "$hits" ]; then
            echo "::error::LOG-02 violated — RecordFormat's byte offsets are referenced outside Durability/internals/."
            echo "$hits"
            echo "WAL record bytes must be produced and consumed only by RecordCodec; reaching for the raw"
            echo "offsets elsewhere is how producer/recovery format drift starts. See claude/rules/durability.md LOG-02."
            exit 1
          fi
          echo "LOG-02: RecordFormat confined to Durability/internals/"

      # ---- #703: a suppressed test must say WHY, and expire. ----
      #
      # `[Ignore]` meant five different things (blocked on a bug / flaky / slow / a manual tool / unstable), so
      # nothing could lint it and nothing revisited it. Two measured consequences: `shards.json` NAMED two
      # class-level [Ignore]d fixtures, so the gate budgeted a shard slot, ran zero tests and reported green; and
      # two tests stayed suppressed against #591 for weeks after #591 closed. The lint gives each marker one
      # meaning and requires an OPEN issue behind every suppression.
      #
      # Runs here rather than in the test job because it is pure source analysis — no build, no c6id. The
      # closed-issue probe uses the built-in GITHUB_TOKEN against THIS repo only, so it keeps the job's
      # self-contained property (no PAT, no cross-repo checkout, green on fork PRs).
      - name: Test-suppression lint (#703)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lint-test-suppressions.py

      # A malformed .runsettings makes `dotnet test` run ZERO tests while the job still looks configured — the
      # nightly's seeded and suppressed tiers were both silently empty because a comment in nightly.runsettings
      # contained `--`. That is a false green one layer BELOW the suppression lints, which reason about which
      # tests are selected and cannot see a settings file that was never parsed (#705).
      - name: Check .runsettings files are well-formed
        run: python3 scripts/check-runsettings.py

      # The lints are themselves tested: each check has a planted violation it must reject, including a planted
      # zero-test shard and the exact double-hyphen comment that shipped. A lint that has never rejected anything
      # is the same false green it exists to remove.
      - name: Lint self-tests (#703)
        run: python3 -m unittest discover -s scripts/tests -v

  # ---- Guard: a closing keyword that would auto-close a PULL REQUEST on merge. ----
  #
  # GitHub scans the PR description and every commit message for a bare `KEYWORD #N` adjacency
  # (close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved) and closes #N when the PR merges
  # into the default branch. The parser has NO notion of negation — "does not retroactively fix #482"
  # links and closes exactly like "fixes #482" — and because pull requests and issues share one
  # numbering space, #N resolving to a PR closes that PR. That is not hypothetical: PR #483's body said
  # "does not retroactively fix #482", which silently closed the unrelated in-flight PR #482 on merge.
  # There is no repo/org setting to disable closing keywords, so this check is the only systemic defense.
  #
  # Fails ONLY when the referenced number is a pull request — `Closes #123` on a real issue is the
  # intended, everyday use and stays green.
  closing-keywords:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5

      - name: Reject closing keywords that target a pull request
        id: keywords
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          # Untrusted, user-controlled — passed via env, NEVER inlined into the shell body (script injection).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail

          # Same two surfaces GitHub itself parses: the PR description and the branch's commit messages.
          # (Squash-merge concatenates commit messages into the squash body, so a stray keyword in any
          # commit on the branch is just as live as one in the description.)
          #
          # The description is Markdown, and GitHub does NOT parse references inside fenced blocks or
          # inline code spans — so strip those first. Without this the guard flags any doc that merely
          # *quotes* a closing keyword, including the backticked form its own error message recommends.
          BODY=$(printf '%s\n' "$PR_BODY" \
            | awk 'BEGIN { fence = 0 } /^[[:space:]]*```/ { fence = !fence; next } !fence' \
            | sed 's/`[^`]*`//g')

          # Commit messages are plain text to GitHub's parser — backticks do NOT defuse a keyword there.
          # So they are scanned raw, with no stripping.
          COMMITS=$(gh api "repos/$REPO/pulls/$PR_NUM/commits" --paginate --jq '.[].commit.message')

          TEXT=$(printf '%s\n%s\n' "$BODY" "$COMMITS")

          # KEYWORD, optional colon, whitespace, #N — GitHub's adjacency rule. An intervening word
          # ("fix PR #482") breaks the link and is therefore correctly NOT matched here either.
          # The leading (^|[^[:alnum:]_]) is a word boundary: without it, "postfix #482" trips on the
          # trailing "fix". Spelled out rather than \b so it does not depend on GNU-grep extensions.
          #
          # The trailing `|| true` is load-bearing. The step's shell is `bash -e` and we add pipefail, so
          # a grep that matches NOTHING (exit 1 — i.e. the healthy, common case) would propagate and kill
          # the script before it prints anything, failing every clean PR. Do not remove it.
          NUMS=$(printf '%s\n' "$TEXT" \
            | grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)

          # Published for the companion step below, and written BEFORE the early exit so the empty case is explicit
          # rather than an absent output.
          echo "closes=$(printf '%s' "$NUMS" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

          if [ -z "$NUMS" ]; then
            echo "No closing keywords found — nothing to check."
            exit 0
          fi

          fail=0
          for n in $NUMS; do
            kind=$(gh api "repos/$REPO/issues/$n" --jq 'if .pull_request then "pr" else "issue" end' 2>/dev/null || echo missing)
            case "$kind" in
              pr)
                echo "::error::Closing keyword targets #$n, which is a PULL REQUEST — merging would auto-close it. Defuse the reference: backtick it (\`#$n\`), write 'PR #$n', or rephrase."
                fail=1
                ;;
              missing)
                echo "::warning::Closing keyword targets #$n, which does not exist in $REPO."
                ;;
              *)
                echo "ok: #$n is an issue — will be closed on merge, as intended."
                ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then
            {
              echo "### ❌ Closing keyword targets a pull request"
              echo
              echo "GitHub would auto-close it when this PR merges. Its parser matches a bare \`KEYWORD #N\`"
              echo "adjacency and **ignores negation** — \`does not fix #N\` closes #N just like \`fixes #N\`."
              echo
              echo "Fix by breaking the adjacency in the PR description (or the offending commit message):"
              echo "- \`\\\`#N\\\`\` — backticks"
              echo "- \`PR #N\` / \`pull request #N\` — an intervening word"
              echo "- rephrase to avoid close/fix/resolve before the reference"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Closing keywords: all target issues. OK."

      # ── The companion: nothing in the tree may still CITE what this PR closes ────────────────────────────
      # `IGNORE_CLOSED_ISSUE` (in `invariants`) asks whether a suppression's issue is closed RIGHT NOW. On a PR that
      # closes #N and leaves an `[Ignore("#N")]` behind, #N is still open while the PR is open — so that check passes,
      # the merge closes #N, and the identical check reddens `main` minutes later. Green before merge, red after, with
      # no run in between that could have caught it. Measured: PR #721 closed #718 with the suppression still in the
      # tree; `invariants` passed on the PR and failed on main at 22:32.
      #
      # This step is the only place in CI that holds both facts at once — the closing set, and the tree as it will be
      # after the merge (`pull_request` checks out the merge ref). Hence here rather than in `invariants`, which runs
      # on push too and has no PR to read a closing set from.
      #
      # It runs the whole lint, so an unrelated violation would be reported here AND by `invariants`. That duplication
      # is deliberate: this job is seconds and fails fast, and two identical messages are cheaper than a second flag to
      # keep in sync.
      - name: Nothing may still cite what this PR closes
        if: steps.keywords.outputs.closes != ''
        env:
          CLOSES: ${{ steps.keywords.outputs.closes }}
        run: |
          set -uo pipefail
          echo "This PR closes: $CLOSES"
          # --no-github: IGNORE_CLOSED_ISSUE is `invariants`' job, and this runner has no reason to re-probe the API.
          python3 scripts/lint-test-suppressions.py --no-github --closing "$CLOSES"

  # ---- The ONLY required check. Aggregates: skipped → pass, failure/cancelled → fail. ----
  gate:
    needs: [changes, aws-gate, aws-gate-selfhosted, tla, rule-coverage, invariants, closing-keywords]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compute verdict
        run: |
          changes='${{ needs.changes.result }}'
          aws='${{ needs.aws-gate.result }}'
          awssh='${{ needs.aws-gate-selfhosted.result }}'
          tla='${{ needs.tla.result }}'
          rules='${{ needs.rule-coverage.result }}'
          inv='${{ needs.invariants.result }}'
          keywords='${{ needs.closing-keywords.result }}'
          echo "changes=$changes  aws-gate=$aws  aws-gate-selfhosted=$awssh  tla=$tla  rule-coverage=$rules  invariants=$inv  closing-keywords=$keywords"
          fail=0
          # changes must succeed; the two aws-gate variants + tla may legitimately be 'skipped' (nothing relevant
          # changed, or the other runner variant is inactive), and closing-keywords is 'skipped' on push/dispatch.
          [ "$changes" = "success" ] || { echo "change-detection failed"; fail=1; }
          case "$aws" in failure|cancelled) echo "aws-gate failed"; fail=1 ;; esac
          case "$awssh" in failure|cancelled) echo "aws-gate-selfhosted failed"; fail=1 ;; esac
          case "$tla" in failure|cancelled) echo "tla failed"; fail=1 ;; esac
          # rule-coverage is path-gated like tla, so 'skipped' is legitimate; a REGRESSION is not (#703).
          case "$rules" in failure|cancelled) echo "rule-coverage audit failed"; fail=1 ;; esac
          # invariants has no `if:` guard — it runs on every event, so anything but success is a red gate.
          [ "$inv" = "success" ] || { echo "invariants gate failed"; fail=1; }
          case "$keywords" in failure|cancelled) echo "closing-keywords guard failed"; fail=1 ;; esac
          if [ "$fail" -ne 0 ]; then echo "Merge gate: RED"; exit 1; fi
          echo "Merge gate: GREEN"
