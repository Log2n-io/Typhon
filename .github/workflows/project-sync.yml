# Typhon Development Project Sync
#
# Automatically adds new issues to the "Typhon dev" GitHub Project
# and performs basic housekeeping when issues/PRs are updated.
#
# Project: https://github.com/orgs/Log2n-io/projects/1
#
# IMPORTANT: This workflow requires a Personal Access Token (PAT) stored as
# the repository secret PROJECT_TOKEN. The default GITHUB_TOKEN cannot access
# user-level projects. Create a classic PAT with 'project' and 'repo' scopes.

name: Project Sync

on:
  issues:
    types: [opened, closed, reopened]
  # pull_request_target (NOT pull_request): secrets — including PROJECT_TOKEN — are withheld from `pull_request` runs that
  # originate in a fork, so board sync failed for every external contributor's PR (gh exits 4 on an empty GH_TOKEN).
  # pull_request_target runs in the BASE repo's context, so the secret is available.
  #
  # SAFETY — pull_request_target is only sound because this workflow never trusts fork content:
  #   1. It does NOT check out the PR's code (no actions/checkout), so no attacker-supplied code is ever executed.
  #   2. The only fork-controlled values it reads (PR title, head ref) are passed via `env:`, never inlined into `run:`.
  #   3. `permissions: {}` below strips GITHUB_TOKEN of all scopes.
  # Adding a checkout of the PR head, or inlining ${{ … }} of any user-controlled field into a shell body, would turn this
  # into a repository-takeover vector. Do neither.
  pull_request_target:
    types: [opened, closed]

# The jobs authenticate exclusively with the PROJECT_TOKEN PAT; GITHUB_TOKEN needs no scopes at all.
permissions: {}

env:
  # Organization-owned project: https://github.com/orgs/Log2n-io/projects/1
  # Project ID from: gh api graphql -f query='{ organization(login: "Log2n-io") { projectV2(number: 1) { id } } }'
  PROJECT_ID: PVT_kwDOEcGj5M4Bb-8P
  # Field IDs for Status field
  STATUS_FIELD_ID: PVTSSF_lADOEcGj5M4Bb-8PzhWrH1A
  # Status option IDs (org project #1 has: Todo / In Progress / Done)
  STATUS_TODO: "f75ad846"
  STATUS_IN_PROGRESS: "47fc9ee4"
  STATUS_DONE: "98236657"

jobs:
  # Automatically add new issues to the project
  add-to-project:
    name: Add to Project
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Use GraphQL to add item to the org-owned project (works for both user and org projects)

          gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item {
                  id
                }
              }
            }
          ' -f project="$PROJECT_ID" -f issue="$ISSUE_NODE_ID"

          echo "✅ Added issue #$ISSUE_NUMBER to Typhon dev project"

  # Update project status when issues are closed
  update-status-on-close:
    name: Update Status on Close
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Update status to Done
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |

          # Get the project item ID for this issue
          ITEM_ID=$(gh api graphql -f query='
            query($project: ID!) {
              node(id: $project) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          id
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f project="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.id == \"$ISSUE_NODE_ID\") | .id")

          if [ -n "$ITEM_ID" ]; then
            # Update status to Done
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: {singleSelectOptionId: $value}
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            ' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f value="$STATUS_DONE"

            echo "✅ Updated issue #$ISSUE_NUMBER status to Done"
          else
            echo "⚠️ Could not find project item for issue #$ISSUE_NUMBER"
          fi

  # Update project status when issues are reopened
  update-status-on-reopen:
    name: Update Status on Reopen
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Update status to In Progress
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |

          # Get the project item ID for this issue
          ITEM_ID=$(gh api graphql -f query='
            query($project: ID!) {
              node(id: $project) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          id
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f project="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.id == \"$ISSUE_NODE_ID\") | .id")

          if [ -n "$ITEM_ID" ]; then
            # Update status to In Progress
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: {singleSelectOptionId: $value}
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            ' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f value="$STATUS_IN_PROGRESS"

            echo "✅ Updated issue #$ISSUE_NUMBER status to In Progress"
          else
            echo "⚠️ Could not find project item for issue #$ISSUE_NUMBER"
          fi

  # Link PRs to issues and update status
  link-pr-to-issue:
    name: Link PR and Update Status
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Extract issue number and update status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Pass untrusted, user-controlled values through env vars — NEVER inline ${{ … }} into the shell body. A PR title
          # like `("strict mode")` or `$(…)` inlined into `run:` is parsed/executed by bash (GitHub Actions script injection).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Extract issue number from PR title or branch name
          # Supports formats: "fix #123", "feature/123-name", "fix/123-name"

          # Try to extract from title first (e.g., "Fix #123: description")
          ISSUE_NUM=$(echo "$PR_TITLE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)

          # If not found, try branch name (e.g., "feature/123-name" or "fix/123-name")
          if [ -z "$ISSUE_NUM" ]; then
            ISSUE_NUM=$(echo "$PR_BRANCH" | grep -oE '(feature|fix)/[0-9]+' | grep -oE '[0-9]+' || true)
          fi

          if [ -n "$ISSUE_NUM" ]; then
            echo "Found linked issue: #$ISSUE_NUM"

            # Get issue node ID
            ISSUE_NODE_ID=$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUM" --jq '.node_id')

            if [ -n "$ISSUE_NODE_ID" ]; then
              # Get the project item ID
              ITEM_ID=$(gh api graphql -f query='
                query($project: ID!) {
                  node(id: $project) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                }
              ' -f project="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.id == \"$ISSUE_NODE_ID\") | .id")

              if [ -n "$ITEM_ID" ]; then
                # Update status to In Progress (org project #1 has no Review status)
                gh api graphql -f query='
                  mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $project
                      itemId: $item
                      fieldId: $field
                      value: {singleSelectOptionId: $value}
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                ' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f value="$STATUS_IN_PROGRESS"

                echo "✅ Updated issue #$ISSUE_NUM status to In Progress"
              fi
            fi
          else
            echo "ℹ️ No issue number found in PR title or branch name"
          fi

  # Update status when PR is merged
  update-on-merge:
    name: Update Status on Merge
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Update linked issue status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Untrusted, user-controlled — passed via env, never inlined into the shell body (script-injection safe).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |

          # Extract issue number
          ISSUE_NUM=$(echo "$PR_TITLE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -z "$ISSUE_NUM" ]; then
            ISSUE_NUM=$(echo "$PR_BRANCH" | grep -oE '(feature|fix)/[0-9]+' | grep -oE '[0-9]+' || true)
          fi

          if [ -n "$ISSUE_NUM" ]; then
            echo "PR merged, updating issue #$ISSUE_NUM"

            # This used to close the issue outright, and that made it a THIRD way for an issue to close — alongside a
            # closing keyword in the squash message and one in the PR description. It fired on the first `#N` in the PR
            # TITLE, unconditionally, which collides head-on with this repo's own convention of prefixing a title with
            # the issue a change RELATES to. A leading `#N` means "about", not "completes".
            #
            # It closed #722 minutes after that issue was filed to track REMAINING work (PR #723 was titled
            # "#722 Repoint the quarantined view test ..."), which turned an [Ignore("#722")] into a reference to a
            # closed issue and reddened main. Neither the closing-keywords gate nor the suppression companion added in
            # #725 could see it: both read keywords, and this path used none.
            #
            # Closing is now GitHub's job alone, driven by an explicit `Closes #N`. One mechanism, one gate.
            #
            # The BOARD still moves — that is the half worth keeping — but it now reads the issue's ACTUAL state rather
            # than assuming the merge completed it, so it can no longer report Done for something still open.
            ISSUE_STATE=$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUM" --jq '.state' || echo "")
            if [ "$ISSUE_STATE" = "closed" ]; then
              # A closing keyword (or a human) closed it. `update-status-on-close` normally handles this via the
              # issues.closed event; repeating it here is harmless and covers an issue closed BEFORE the merge, where
              # no such event fires at merge time.
              TARGET_STATUS="$STATUS_DONE"
              TARGET_NAME="Done"
            else
              # Still open, and its PR is no longer open either — so by the three-state lifecycle it is neither Done nor
              # In Progress ("an issue stays In Progress while its PR is open"). Todo is the honest column: work landed,
              # the issue survived it, nobody is actively on it.
              TARGET_STATUS="$STATUS_TODO"
              TARGET_NAME="Todo"
            fi
            echo "Issue #$ISSUE_NUM is $ISSUE_STATE -> board $TARGET_NAME"

            # Get issue node ID
            ISSUE_NODE_ID=$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUM" --jq '.node_id')

            if [ -n "$ISSUE_NODE_ID" ]; then
              # Get project item and update status to Done
              ITEM_ID=$(gh api graphql -f query='
                query($project: ID!) {
                  node(id: $project) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                }
              ' -f project="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.id == \"$ISSUE_NODE_ID\") | .id")

              if [ -n "$ITEM_ID" ]; then
                gh api graphql -f query='
                  mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $project
                      itemId: $item
                      fieldId: $field
                      value: {singleSelectOptionId: $value}
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                ' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f value="$TARGET_STATUS"

                echo "✅ Issue #$ISSUE_NUM moved to $TARGET_NAME"
              fi
            fi
          else
            echo "ℹ️ No issue number found in PR title or branch name"
          fi
