# Typhon Development Project Sync
#
# Automatically adds new issues to the "Typhon dev" GitHub Project
# and performs basic housekeeping when issues/PRs are updated.
#
# Project: https://github.com/orgs/Log2n-io/projects/1
#
# IMPORTANT: This workflow requires a Personal Access Token (PAT) stored as
# the repository secret PROJECT_TOKEN. The default GITHUB_TOKEN cannot access
# user-level projects. Create a classic PAT with 'project' and 'repo' scopes.

name: Project Sync

on:
  issues:
    types: [opened, closed, reopened]
  # pull_request_target (NOT pull_request): secrets — including PROJECT_TOKEN — are withheld from `pull_request` runs that
  # originate in a fork, so board sync failed for every external contributor's PR (gh exits 4 on an empty GH_TOKEN).
  # pull_request_target runs in the BASE repo's context, so the secret is available.
  #
  # SAFETY — pull_request_target is only sound because this workflow never trusts fork content:
  #   1. It does NOT check out the PR's code (no actions/checkout), so no attacker-supplied code is ever executed.
  #   2. The only fork-controlled values it reads (PR title, head ref) are passed via `env:`, never inlined into `run:`.
  #   3. `permissions: {}` below strips GITHUB_TOKEN of all scopes.
  # Adding a checkout of the PR head, or inlining ${{ … }} of any user-controlled field into a shell body, would turn this
  # into a repository-takeover vector. Do neither.
  pull_request_target:
    types: [opened, closed]

# The jobs authenticate exclusively with the PROJECT_TOKEN PAT; GITHUB_TOKEN needs no scopes at all.
permissions: {}

env:
  # Organization-owned project: https://github.com/orgs/Log2n-io/projects/1
  # Project ID from: gh api graphql -f query='{ organization(login: "Log2n-io") { projectV2(number: 1) { id } } }'
  PROJECT_ID: PVT_kwDOEcGj5M4Bb-8P
  # Field IDs for Status field
  STATUS_FIELD_ID: PVTSSF_lADOEcGj5M4Bb-8PzhWrH1A
  # Status option IDs (org project #1 has: Todo / In Progress / Done)
  STATUS_TODO: "f75ad846"
  STATUS_IN_PROGRESS: "47fc9ee4"
  STATUS_DONE: "98236657"

jobs:
  # Automatically add new issues to the project
  add-to-project:
    name: Add to Project
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Use GraphQL to add item to the org-owned project (works for both user and org projects)

          gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item {
                  id
                }
              }
            }
          ' -f project="$PROJECT_ID" -f issue="$ISSUE_NODE_ID"

          echo "✅ Added issue #$ISSUE_NUMBER to Typhon dev project"

  # Update project status when issues are closed
  update-status-on-close:
    name: Update Status on Close
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Update status to Done
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |

          # The add IS the lookup. For an issue already on the board, addProjectV2ItemById returns the existing item — "If you try to add an item
          # that already exists, the existing item ID is returned instead" (GitHub, "Using the API to manage Projects"). The four lookups in this
          # file used to scan items(first: 100) of a board past 400 items: every issue beyond the first page was "not found", the step printed a
          # warning and exited 0, and 22 closed issues were left short of Done with every check green (#1000).
          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item {
                  id
                }
              }
            }
          ' -f project="$PROJECT_ID" -f issue="$ISSUE_NODE_ID" --jq '.data.addProjectV2ItemById.item.id')

          # Fail rather than warn: a green step is read as "the board moved".
          if [ -z "$ITEM_ID" ]; then
            echo "::error::No project item for issue #$ISSUE_NUMBER — the board was not updated"
            exit 1
          fi

          # Update status to Done
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: {singleSelectOptionId: $value}
              }) {
                projectV2Item {
                  id
                }
              }
            }
          ' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f value="$STATUS_DONE"

          echo "✅ Updated issue #$ISSUE_NUMBER status to Done"

      - name: Close the issue's still-open sub-issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
        run: |
          # A Feature closed by its PR's `Closes #N` left every Task under it open, in Todo, forever: nothing else ever reaches a sub-issue. They
          # close with their parent and for the same reason. Each close raises its own issues.closed event (the PAT's events trigger workflows), so
          # each moves itself to Done and closes its own sub-issues in turn.
          if [ "$STATE_REASON" = "completed" ]; then
            REASON="completed"
          else
            REASON="not planned"
          fi

          OPEN_CHILDREN=$(gh api graphql -f query='
            query($issue: ID!) {
              node(id: $issue) {
                ... on Issue {
                  subIssues(first: 100) {
                    nodes { number state }
                  }
                }
              }
            }
          ' -f issue="$ISSUE_NODE_ID" --jq '.data.node.subIssues.nodes[] | select(.state == "OPEN") | .number')

          if [ -z "$OPEN_CHILDREN" ]; then
            echo "ℹ️ #$ISSUE_NUMBER has no open sub-issue"
            exit 0
          fi

          for CHILD in $OPEN_CHILDREN; do
            gh issue close "$CHILD" --repo "$GITHUB_REPOSITORY" --reason "$REASON" --comment "Closed with its parent #$ISSUE_NUMBER."
            echo "✅ Closed sub-issue #$CHILD ($REASON) with #$ISSUE_NUMBER"
          done

  # Update project status when issues are reopened
  update-status-on-reopen:
    name: Update Status on Reopen
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Update status to In Progress
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |

          # The add IS the lookup — see update-status-on-close.
          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item {
                  id
                }
              }
            }
          ' -f project="$PROJECT_ID" -f issue="$ISSUE_NODE_ID" --jq '.data.addProjectV2ItemById.item.id')

          if [ -z "$ITEM_ID" ]; then
            echo "::error::No project item for issue #$ISSUE_NUMBER — the board was not updated"
            exit 1
          fi

          # Update status to In Progress
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: {singleSelectOptionId: $value}
              }) {
                projectV2Item {
                  id
                }
              }
            }
          ' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f value="$STATUS_IN_PROGRESS"

          echo "✅ Updated issue #$ISSUE_NUMBER status to In Progress"

  # A PR opened: every open issue it names goes In Progress
  link-pr-to-issue:
    name: Link PR and Update Status
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Move the PR's issues to In Progress
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Untrusted, user-controlled values go through env vars — NEVER inline ${{ … }} into the shell body. A PR title
          # like `("strict mode")` or `$(…)` inlined into `run:` is parsed/executed by bash (GitHub Actions script injection).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          # Every issue the PR names: each `#N` of its title, a `feature/N` or `fix/N` branch, and every issue its description closes (GitHub's
          # own parse of the closing keywords). Only the title's FIRST `#N` used to move: a PR titled `#1411 … (#1412 #1413 #1414)` moved its Epic
          # and left the three Features it closes in Todo for the life of the PR.
          ISSUES=$( {
            echo "$PR_TITLE" | grep -oE '#[0-9]+' | tr -d '#' || true
            echo "$PR_BRANCH" | grep -oE '(feature|fix)/[0-9]+' | grep -oE '[0-9]+' || true
            gh api graphql -f query='
              query($pr: ID!) {
                node(id: $pr) {
                  ... on PullRequest {
                    closingIssuesReferences(first: 50) { nodes { number } }
                  }
                }
              }
            ' -f pr="$PR_NODE_ID" --jq '.data.node.closingIssuesReferences.nodes[].number'
          } | sort -un )

          if [ -z "$ISSUES" ]; then
            echo "ℹ️ The PR names no issue"
            exit 0
          fi

          for ISSUE_NUM in $ISSUES; do
            # "pr" when `#N` names a pull request: the issues endpoint serves PRs too, and the add below would put a PR on the board. A closed
            # issue stays where it is: a PR mentioning finished work does not move it back.
            ISSUE=$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUM" --jq 'if .pull_request then "pr" else .state + " " + .node_id end' || echo "")
            case "$ISSUE" in
              "open "*) ISSUE_NODE_ID="${ISSUE#open }" ;;
              pr) echo "ℹ️ #$ISSUE_NUM is a pull request, not an issue — skipped"; continue ;;
              *) echo "ℹ️ #$ISSUE_NUM is closed or unreadable — skipped"; continue ;;
            esac

            # The add IS the lookup — see update-status-on-close.
            ITEM_ID=$(gh api graphql -f query='
              mutation($project: ID!, $issue: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                  item {
                    id
                  }
                }
              }
            ' -f project="$PROJECT_ID" -f issue="$ISSUE_NODE_ID" --jq '.data.addProjectV2ItemById.item.id')

            if [ -z "$ITEM_ID" ]; then
              echo "::error::No project item for issue #$ISSUE_NUM — the board was not updated"
              exit 1
            fi

            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: {singleSelectOptionId: $value}
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            ' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f value="$STATUS_IN_PROGRESS"

            echo "✅ Updated issue #$ISSUE_NUM status to In Progress"
          done

  # A PR merged: every closed issue it names goes Done; an open one keeps its Status
  update-on-merge:
    name: Update Status on Merge
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Move the PR's closed issues to Done
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Untrusted, user-controlled values go through env vars — NEVER inline ${{ … }} into the shell body. A PR title
          # like `("strict mode")` or `$(…)` inlined into `run:` is parsed/executed by bash (GitHub Actions script injection).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          # Closing is GitHub's job alone, driven by an explicit `Closes #N` (#722: this job once closed an issue on the first `#N` of a title,
          # which in this repo means "about", not "completes"). What is left here is the board: an issue closed BEFORE the merge raises no
          # issues.closed event at merge time, so a closed one is moved to Done again (harmless when it already is). An issue still open keeps
          # its Status. It used to be sent back to Todo, which is where every Epic landed after each of its Features' PRs: the Epic is named in
          # the title and stays open until its last Feature.
          ISSUES=$( {
            echo "$PR_TITLE" | grep -oE '#[0-9]+' | tr -d '#' || true
            echo "$PR_BRANCH" | grep -oE '(feature|fix)/[0-9]+' | grep -oE '[0-9]+' || true
            gh api graphql -f query='
              query($pr: ID!) {
                node(id: $pr) {
                  ... on PullRequest {
                    closingIssuesReferences(first: 50) { nodes { number } }
                  }
                }
              }
            ' -f pr="$PR_NODE_ID" --jq '.data.node.closingIssuesReferences.nodes[].number'
          } | sort -un )

          if [ -z "$ISSUES" ]; then
            echo "ℹ️ The PR names no issue"
            exit 0
          fi

          for ISSUE_NUM in $ISSUES; do
            ISSUE=$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUM" --jq 'if .pull_request then "pr" else .state + " " + .node_id end' || echo "")
            case "$ISSUE" in
              "closed "*) ISSUE_NODE_ID="${ISSUE#closed }" ;;
              "open "*) echo "ℹ️ #$ISSUE_NUM is still open — its Status is left as it is"; continue ;;
              pr) echo "ℹ️ #$ISSUE_NUM is a pull request, not an issue — skipped"; continue ;;
              *) echo "ℹ️ #$ISSUE_NUM could not be read — skipped"; continue ;;
            esac

            # The add IS the lookup — see update-status-on-close.
            ITEM_ID=$(gh api graphql -f query='
              mutation($project: ID!, $issue: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                  item {
                    id
                  }
                }
              }
            ' -f project="$PROJECT_ID" -f issue="$ISSUE_NODE_ID" --jq '.data.addProjectV2ItemById.item.id')

            if [ -z "$ITEM_ID" ]; then
              echo "::error::No project item for issue #$ISSUE_NUM — the board was not updated"
              exit 1
            fi

            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: {singleSelectOptionId: $value}
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            ' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f value="$STATUS_DONE"

            echo "✅ Issue #$ISSUE_NUM moved to Done"
          done
