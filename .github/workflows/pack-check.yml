name: Pack Check

# Cheap PR gate that catches "packaging silently broke" before merge: packs the .NET packages and the TypeScript SDK, then runs
# - the consumer smoke test (a fresh project that adds the engine package, defines an [Archetype], and must compile + run — which only works if the
#   bundled source generator shipped and fired);
# - the subscriptions smoke test (a Protocol-only contracts assembly, a server on Typhon + Typhon.Subscriptions.AspNetCore, the .NET client over TCP and
#   the TypeScript tarball over WebSocket, all from the local feed).
# The CLI tool + Workbench SPA pack is validated on release (release.yml); the native SDK's package by native-package-check.yml.
# Design: claude/scratch/distribution-packaging-plan-2026-07-06.md §3 (#430), Feature #435; claude/design/Subscriptions/07 § 5 (#1044).
#
# To make this block merges, add "pack-check" to the branch-protection required checks (owner action).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer derives the version from git history; a full clone avoids a shallow-clone version warning.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Pack the .NET packages
        run: |
          set -euo pipefail
          for project in \
              src/Typhon.Protocol/Typhon.Protocol.csproj \
              src/Typhon.Engine/Typhon.Engine.csproj \
              src/Typhon.Client/Typhon.Client.csproj \
              src/Typhon.Subscriptions.AspNetCore/Typhon.Subscriptions.AspNetCore.csproj; do
            dotnet pack "$project" -c Release -o artifacts
          done

      - name: Pack the TypeScript SDK
        working-directory: src/Typhon.Client.TypeScript
        run: |
          set -euo pipefail
          npm ci
          npm pack --pack-destination ../../artifacts

      # The crux: a clean-feed consumer build must compile `Unit.ReadAll(...)` (proves the ArchetypeAccessorGenerator
      # shipped inside the package AND ran in the consumer's compilation) and then open a DB + spawn/read.
      - name: Consumer smoke test (engine package)
        run: bash scripts/consumer-smoke-test.sh artifacts

      - name: Subscriptions smoke test (Protocol, Client, AspNetCore, TypeScript)
        run: python3 scripts/subscription-smoke-test.py artifacts --ts-tarball "$(ls artifacts/typhondb-client-*.tgz)"
