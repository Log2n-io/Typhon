name: Nightly suppressed tier

# Runs the tests the PR gate deliberately does NOT run: `[Explicit] + [Category("Nightly")]` — chaos, stress,
# torture and race-density fixtures whose duration keeps them out of the gate.
#
# WHY THIS EXISTS (#703 / design `Infrastructure/test-strategy.md` §5.2). `[Explicit]` was being used to mean
# "run this manually someday", and nothing ever did:
#   * `ChaosStressTests` was `[Ignore("Too long…")]`. It was not slow, it HUNG — a BTree.SpinWriteLock livelock
#     (#695) — plus 5 deterministic failures on its first-ever execution (#696). The label hid both.
#   * `OlcBTreeStressTests` / `OlcBTreeRaceStressTests` were `[Explicit]` with no tier, so the latch-coupled-SMO
#     fix whose design claims "Validated By: stress tests from #117" had NO running evidence in CI after
#     February 2026.
# A marker that removes a test from the gate is only honest if some tier still runs it. This is that tier.
#
# NON-BLOCKING by design: a nightly is a signal, not a merge gate, and it is never a required check. What it is
# NOT allowed to be is quiet — see the "selected zero tests" guard below, which is the whole point of the job.

on:
  schedule:
    - cron: "0 1 * * *"     # 01:00 UTC daily — an hour after the arm64 nightly so the two do not contend for
                            # hosted-runner capacity, and still well before the European morning.
  workflow_dispatch: {}
  # Self-validation: this workflow runs on any PR that touches its own inputs, and only then. Scheduled workflows
  # exist only once they are on the default branch, so without this a change here could not be tested before it
  # merged. Same pattern as nightly-macos-arm64.yml.
  pull_request:
    paths:
      - '.github/workflows/nightly-suppressed.yml'
      - 'bench/aws/nightly.runsettings'

concurrency:
  group: nightly-suppressed
  cancel-in-progress: false   # a nightly is a data point; let a slow run finish rather than dropping the night.

permissions:
  contents: read

jobs:
  suppressed:
    # GitHub-hosted on purpose: this must NOT consume the self-hosted c6id the merge gate depends on. These
    # fixtures assert correctness under load (fan-out completeness, invariant conservation, no lost keys), not
    # throughput, so a slower shared runner changes the duration, not the verdict. Anything whose assertion IS a
    # wall-clock threshold belongs to [Category("Manual")] instead, which this job deliberately does not select.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build test/Typhon.Engine.Tests/Typhon.Engine.Tests.csproj -c Release

      # `Category=Nightly` is a ONE-term filter, and that is load-bearing: NUnit runs an [Explicit] test when it
      # reads the filter as naming it. The gate's 305-term class filter does not qualify, which is precisely why
      # these fixtures never ran there. Keep this filter narrow — widening it re-hides them.
      - name: Run the Nightly tier
        continue-on-error: true      # a red here reports; it does not fail the workflow (non-blocking by design)
        run: |
          set -uo pipefail
          mkdir -p ci-out
          # --blame-hang is load-bearing, not belt-and-braces. NUnit's DefaultTimeout cannot stop a CPU-bound
          # spin (.NET has no Thread.Abort) — measured against the #695 livelock on 2026-08-07, the run had to be
          # killed from outside. Without this, one hung stress test eats the 60-minute job timeout and the log
          # says nothing about which test hung. With it, vstest kills the host and names the test in a
          # Sequence_*.xml, which the artifact upload below preserves.
          dotnet test test/Typhon.Engine.Tests/Typhon.Engine.Tests.csproj \
            -c Release --no-build \
            --filter "Category=Nightly" \
            --settings bench/aws/nightly.runsettings \
            --blame-hang --blame-hang-timeout 300s \
            --logger "trx;LogFileName=nightly.trx" \
            --results-directory ci-out \
            2>&1 | tee ci-out/nightly.log

      # ── The load-bearing guard ────────────────────────────────────────────────────────────────────────────
      # A tier that selects ZERO tests and reports green is the exact defect this whole issue is about, one level
      # up: `shards.json` named two [Ignore]d fixtures, ran nothing, and the gate went green. If a rename, a
      # dropped category or a filter typo empties this run, that must be LOUD — and unlike the test results, it
      # is blocking, because it means the job is no longer testing anything.
      - name: Assert the tier actually selected tests
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          NS = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
          files = glob.glob("ci-out/*.trx")
          if not files:
              print("::error::The Nightly tier produced no trx at all — the run did not execute.")
              sys.exit(1)
          total = passed = failed = 0
          for f in files:
              c = ET.parse(f).getroot().find(f"{NS}ResultSummary/{NS}Counters")
              if c is None:
                  continue
              total += int(c.get("total", 0)); passed += int(c.get("passed", 0)); failed += int(c.get("failed", 0))
          print(f"Nightly tier: total={total} passed={passed} failed={failed}")
          with open("summary.md", "w", encoding="utf-8") as fh:
              fh.write(f"## Nightly suppressed tier\n\n| total | passed | failed |\n|---|---|---|\n"
                       f"| {total} | {passed} | {failed} |\n")
          if total == 0:
              print("::error::`Category=Nightly` selected ZERO tests. Either the category was dropped from every "
                    "fixture, or the filter no longer matches. A tier that runs nothing while reporting success is "
                    "the false green #703 exists to remove — failing on purpose.")
              sys.exit(1)
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report the tier's failures
        if: always()
        run: |
          set -uo pipefail
          {
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          NS = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
          rows = []
          for f in glob.glob("ci-out/*.trx"):
              root = ET.parse(f).getroot()
              names = {}
              for ut in root.iter(f"{NS}UnitTest"):
                  tm = ut.find(f"{NS}TestMethod")
                  if ut.get("id") and tm is not None:
                      names[ut.get("id")] = f'{tm.get("className")}.{tm.get("name")}'
              for r in root.iter(f"{NS}UnitTestResult"):
                  if r.get("outcome") == "Failed":
                      rows.append(names.get(r.get("testId"), r.get("testName", "?")))
          if rows:
              print("### Failures\n")
              for r in sorted(set(rows)):
                  print(f"- `{r}`")
              print("\nThese are tracked reds of the Nightly tier — file or update an issue, do NOT re-suppress "
                    "(#703). Known: #695 (BTree.SpinWriteLock livelock), #696 (ChaosStressTests deterministic "
                    "failures).")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw artifacts (.trx / logs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-suppressed
          path: ci-out/**
          if-no-files-found: ignore
