name: Benchmark

# OPT-IN, NON-blocking benchmark on the z1d.metal reference box. Never gates a merge.
# Triggers: add the `run-benchmark` label to a PR, or run manually with a profile.
# The reference numbers + history are published ONLY from here (z1d.metal); local /benchmark
# is dev-only and never commits. Design: claude/design/Infrastructure/ci-merge-gate.md

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        type: choice
        default: regression
        options: [regression, btree-fast, btree-medium, btree-full]
  pull_request:
    types: [labeled]            # fires once when the `run-benchmark` label is added

# contents: write — push the single history+report commit back to the PR branch.
# pull-requests: write — post/update the sticky report-link comment on the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    # Runs ONLY on explicit opt-in — never on a normal PR/push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-benchmark'
    runs-on: ubuntu-latest
    # ---- COST FAIL-SAFE (#729, 2026-08-09). ----
    # `sky launch` holds a billed VM for exactly as long as this job runs, and an uncapped job inherits GitHub's
    # 360-minute default — so a hang here strands a z1d.metal — the most expensive instance any workflow here launches for six hours. Opt-in-only triggers make that unlikely,
    # not impossible, and the cost of being wrong is the whole point of capping it.
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
      PROFILE: ${{ github.event.inputs.profile || 'regression' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the PR head branch so we can commit the refreshed report back to it.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install SkyPilot
        run: python3 -m pip install --quiet "skypilot[aws]"

      - name: Run benchmark on z1d.metal
        run: |
          sky launch bench/aws/benchmark.sky.yaml -c typhon-benchmark-${{ github.run_id }} --down -y \
            --env PROFILE="$PROFILE" \
            --env RUN_ID=${{ github.run_id }}

      # `--down` sets AUTODOWN, which the skylet executes ON THE VM — it is not a teardown issued from this runner. So it
      # needs ec2:TerminateInstances in the *instance role*, and it is silently a no-op when the VM cannot terminate
      # itself: #971 scoped that away and left three c6id boxes running for hours. This step is the backstop, and it has
      # to work without SkyPilot's cooperation — `sky down` needs sky's local state, which a cancelled or timed-out job
      # may never have written, while the tag filter needs nothing but the API.
      #
      # It replaces `sky down -y <task name>`, which never matched anything: that name is the *task* name inside the
      # .sky.yaml, while `sky launch` without `-c` generates a cluster called `sky-<hash>-<user>`. The step printed
      # "Cluster(s) not found" on every run it ever made, including the ones it existed to protect. `-c` on the launch
      # is what makes the name ours and this step able to name it.
      - name: Tear down the VM (always, including on timeout or cancel)
        if: always()
        run: |
          set -uo pipefail
          CLUSTER='typhon-benchmark-${{ github.run_id }}'
          # The API sweep runs FIRST, deliberately. It needs nothing but credentials, finishes in seconds, and works
          # when sky's local state was never written (a launch killed between RunInstances and its bookkeeping).
          # `sky down` needs that state and can take minutes, so on a cancellation it can eat the whole grace window
          # and leave the box running. Terminating out from under sky is safe — it then finds the instances gone.
          #
          # Two exact tag values rather than one prefix glob: `<cluster>*` would also match a run whose id is this
          # one with more digits, and killing a concurrent run's VM is a worse failure than missing one.
          TAGF="Name=tag:skypilot-cluster-name,Values=${CLUSTER},${CLUSTER}-*"
          STATEF="Name=instance-state-name,Values=pending,running,stopping,stopped"
          Q='Reservations[].Instances[].InstanceId'
          ids=$(aws ec2 describe-instances --region eu-west-1 --filters "$TAGF" "$STATEF" --query "$Q" --output text || true)
          if [ -n "${ids:-}" ]; then
            echo "::warning::terminating instances left for ${CLUSTER}: ${ids}"
            aws ec2 terminate-instances --region eu-west-1 --instance-ids ${ids} >/dev/null || true
          fi
          timeout 120 sky down -y "$CLUSTER" || true

      - name: Pull results from S3
        if: always()
        run: |
          mkdir -p bench-out
          aws s3 sync "s3://typhon-traces/benchmark/${{ github.run_id }}/" bench-out/ || true

      # Publish the reference artifact FIRST — BEFORE rendering the step summary — so the summary can
      # pin its chart links to the just-pushed commit SHA (no race). Makes ONE commit; no re-trigger
      # loop (this workflow only fires on label/dispatch).
      - name: Commit refreshed reference report
        if: success()
        run: |
          [ -f bench-out/results.jsonl ] || { echo "no results to commit"; exit 0; }
          cp bench-out/results.jsonl benchmark/history/results.jsonl
          rm -rf benchmark/reports
          mkdir -p benchmark/reports
          cp -r bench-out/reports/. benchmark/reports/
          git config user.name  "typhon-benchmark-bot"
          git config user.email "noreply@typhondb.io"
          git add benchmark/history/results.jsonl benchmark/reports
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
          else
            git commit -m "benchmark: record ${PROFILE} run on z1d.metal [skip ci]"
            git push
          fi

      - name: Render report on the check page
        if: always()
        run: |
          if [ -f bench-out/reports/latest.md ]; then
            # The report's chart links are relative (`charts/foo.svg`) — correct in the repo file browser,
            # but broken on the Actions step summary, which has no repo-relative base. Rewrite them to
            # absolute raw URLs pinned to the CURRENT commit SHA. The Commit step above already pushed the
            # fresh charts at this SHA (on success), so the link is immutable and never races the push — a
            # branch-ref link (the previous approach) embedded whatever the branch tree was when the summary
            # rendered, which is BEFORE the commit landed, so it showed the stale (pre-run) chart. The SHA is
            # a git hash (no injection risk), so it is safe to inline. (On failure the Commit step is skipped
            # and the charts may 404, but the report text still renders.) The committed latest.md keeps its
            # relative links.
            SHA=$(git rev-parse HEAD)
            sed "s#](charts/#](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/benchmark/reports/charts/#g" \
              bench-out/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No benchmark report produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Post (or update) a sticky comment on the PR linking to the committed report. Reliable on the
      # label trigger (the PR is in the event payload); best-effort on workflow_dispatch (looks up an
      # open PR for the branch, no-ops if none). Idempotent via a hidden marker so repeat runs update
      # one comment instead of spamming. Best-effort: a failed comment never fails the benchmark.
      - name: Comment report link on the PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, never inlined into the script body, for shell-injection hygiene.
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -u
          # Only comment when THIS run produced a fresh report.
          [ -f bench-out/reports/latest.md ] || { echo "no fresh report — skipping PR comment"; exit 0; }

          # Resolve the PR number: event payload first (label trigger), else an open PR for the
          # branch (workflow_dispatch). No PR → nothing to comment on.
          PR="$PR_FROM_EVENT"
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json number --jq '.[0].number // empty')
          fi
          [ -n "$PR" ] || { echo "no open PR for '$HEAD_REF' — skipping PR comment"; exit 0; }

          SHA=$(git rev-parse HEAD)          # the commit holding the refreshed report (prior step)
          SHORT=$(git rev-parse --short HEAD)
          URL="https://github.com/${GITHUB_REPOSITORY}/blob/${SHA}/benchmark/reports/latest.md"
          MARKER="<!-- typhon-benchmark-report -->"
          # Marker on its OWN line (\n after it): an HTML comment at the START of a line opens a CommonMark raw-HTML
          # block that swallows the rest of that line, so same-line markdown (the [link], **bold**) renders as literal
          # text. printf builds the two lines without the YAML block indentation that would otherwise prefix line 2 with
          # spaces and turn it into a markdown code block. Single-quoted format → the backticks/`$` are literal.
          BODY=$(printf '%s\n📊 **Benchmark (`%s`)** finished — [full report](%s) · commit `%s`' "$MARKER" "$PROFILE" "$URL" "$SHORT")

          # Replace-in-place: DELETE any previous benchmark comment(s), then POST a fresh one — so this run's
          # comment lands at the BOTTOM of the PR and fires a notification. (A PATCH edits the old comment
          # silently at its original timeline position — invisible as new activity, which is why a run can look
          # like it "didn't post".) Still exactly one benchmark comment at a time, found via the hidden marker
          # (jq reads it from env to avoid quoting into the filter). The loop deletes any duplicates too. All
          # best-effort: a comment failure never fails the benchmark.
          for CID in $(MARKER="$MARKER" gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
              --jq '.[] | select(.body | contains(env.MARKER)) | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${CID}" \
              && echo "Removed previous benchmark comment $CID" || echo "delete $CID failed (non-fatal)"
          done
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY" \
            && echo "Posted fresh benchmark comment on PR #$PR" || echo "comment post failed (non-fatal)"
