name: Feature Request
description: Propose a capability or enhancement.
title: "[Feature]: "
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why can't you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Concurrency
        - Execution
        - Storage
        - Durability
        - MVCC
        - Schema
        - Spatial
        - Query
        - Runtime
        - Observability
        - Resources
        - Errors
        - Utilities
        - Workbench
        - Indexes
        - Unsure
    validations:
      required: true
