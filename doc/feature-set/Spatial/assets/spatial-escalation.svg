<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t   { font-size: 21px; font-weight: 700; fill: #18181b; }
    .st  { font-size: 13.5px; fill: #52525b; }
    .h   { font-size: 15px; font-weight: 700; fill: #18181b; }
    .hs  { font-size: 12px; fill: #71717a; }
    .fl  { font-size: 10.5px; font-weight: 700; fill: #52525b; letter-spacing: 0.5px; }
    .b   { font-size: 11.5px; fill: #3f3f46; }
    .lm  { font-size: 11.5px; fill: #71717a; }
    .lb  { font-size: 13px; font-weight: 700; fill: #3f3f46; }
    .mono{ font-size: 11.5px; font-family: ui-monospace, Consolas, monospace; fill: #3f3f46; }
    .ctr { font-size: 10.5px; font-family: ui-monospace, Consolas, monospace; fill: #52525b; }
    .cap { font-size: 11px; fill: #71717a; }
    .cost{ font-size: 13px; font-weight: 700; }
  </style>
  <rect width="1200" height="880" fill="#ffffff"/>
  <defs>
    <marker id="mv" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="os" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#d97706"/></marker>
    <marker id="oe" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M7,0 L0,3.5 L7,7 z" fill="#d97706"/></marker>
  </defs>

  <text class="t"  x="40" y="38">Three responses to motion, in ascending cost</text>
  <text class="st" x="40" y="60">The engine does the cheapest thing that keeps the answer good enough. Each response has its own threshold, on its own quantity, with its own counter.</text>

  <!-- ══════════ 1 · HYSTERESIS ══════════ -->
  <text class="h"  x="60" y="100">1 &#183; Absorb it</text>
  <text class="hs" x="60" y="118">an entity jitters across a cell boundary</text>
  <g>
    <rect x="60"  y="140" width="150" height="160" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="210" y="140" width="150" height="160" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect x="196" y="140" width="28" height="160" fill="#f59e0b" fill-opacity="0.18" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="218" cy="220" r="5" fill="#f59e0b"/>
    <path d="M 204 248 L 190 248" stroke="#d97706" stroke-width="1.5" marker-end="url(#oe)"/>
    <path d="M 228 248 L 242 248" stroke="#d97706" stroke-width="1.5" marker-end="url(#os)"/>
    <text class="cap" x="70"  y="160">cell A</text>
    <text class="cap" x="316" y="160">cell B</text>
  </g>
  <text class="cap" x="60" y="322">the margin band straddles the boundary, on both sides</text>

  <rect x="60" y="336" width="300" height="260" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" rx="4"/>
  <text class="fl" x="76" y="358">GOVERNED BY</text>
  <text class="b"  x="76" y="376"><tspan class="mono" font-weight="700">MigrationHysteresisRatio</tspan> &#8212; 0.05</text>
  <text class="fl" x="76" y="416">FIRES WHEN</text>
  <text class="b"  x="76" y="434">the entity is past the boundary but still</text>
  <text class="b"  x="76" y="450">within <tspan class="mono">cellSize &#215; 0.05</tspan> of it</text>
  <text class="fl" x="76" y="490">COSTS</text>
  <text class="b"  x="76" y="508">nothing moves at all &#8212; one comparison</text>
  <text class="b"  x="76" y="524">per crossing</text>
  <text class="fl" x="76" y="548">WATCH</text>
  <text class="ctr" x="76" y="566">HysteresisAbsorbedCount</text>
  <text class="ctr" x="76" y="582">against MigrationCount</text>

  <!-- ══════════ 2 · RELOCATION ══════════ -->
  <text class="h"  x="450" y="100">2 &#183; Move one entity</text>
  <text class="hs" x="450" y="118">an entity drifts out of its cluster, inside the cell</text>
  <g>
    <rect x="450" y="140" width="300" height="160" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="468" y="158" width="126" height="118" fill="#fef3c7" fill-opacity="0.8" stroke="#d97706" stroke-width="1.5"/>
    <rect x="612" y="166" width="122" height="110" fill="#dcfce7" fill-opacity="0.8" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="478" y="170" width="86" height="86" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 3"/>
    <g fill="#f59e0b">
      <circle cx="496" cy="188" r="3.6"/><circle cx="524" cy="180" r="3.6"/><circle cx="548" cy="202" r="3.6"/>
      <circle cx="504" cy="224" r="3.6"/><circle cx="536" cy="240" r="3.6"/><circle cx="556" cy="214" r="3.6"/>
    </g>
    <g fill="#22c55e">
      <circle cx="628" cy="184" r="3.6"/><circle cx="662" cy="196" r="3.6"/><circle cx="700" cy="180" r="3.6"/>
      <circle cx="640" cy="240" r="3.6"/><circle cx="686" cy="252" r="3.6"/><circle cx="714" cy="222" r="3.6"/>
    </g>
    <circle cx="586" cy="262" r="5" fill="#dc2626"/>
    <path d="M 596 258 L 646 236" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mv)"/>
    <text class="cap" x="482" y="166" fill="#b45309">target region</text>
  </g>
  <text class="cap" x="450" y="322">the drifter takes the cluster whose bound grows least</text>

  <rect x="450" y="336" width="300" height="260" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" rx="4"/>
  <text class="fl" x="466" y="358">GOVERNED BY</text>
  <text class="b"  x="466" y="376"><tspan class="mono" font-weight="700">ClusterTargetExtentRatio</tspan> &#8212; 0.25</text>
  <text class="b"  x="466" y="392">with <tspan class="mono" font-weight="700">ClusterDriftMarginRatio</tspan> &#8212; 0.05</text>
  <text class="fl" x="466" y="416">FIRES WHEN</text>
  <text class="b"  x="466" y="434">the cluster&#8217;s widest axis passes</text>
  <text class="b"  x="466" y="450"><tspan class="mono">cellSize &#215; 0.25</tspan>, and then an entity sits</text>
  <text class="b"  x="466" y="466">outside the region by more than the margin</text>
  <text class="fl" x="466" y="490">COSTS</text>
  <text class="b"  x="466" y="508">one migration &#8212; component bytes copied,</text>
  <text class="b"  x="466" y="524">slots claimed and freed, indexes patched</text>
  <text class="fl" x="466" y="548">WATCH</text>
  <text class="ctr" x="466" y="566">DriftersDetected &#183; DriftAbsorbedCount</text>
  <text class="ctr" x="466" y="582">RelocationsThrottled &#183; DriftersUnplaced</text>

  <!-- ══════════ 3 · REPAIR ══════════ -->
  <text class="h"  x="840" y="100">3 &#183; Rebuild the cell</text>
  <text class="hs" x="840" y="118">the cell degraded past what one move can fix</text>
  <g>
    <rect x="840" y="140" width="300" height="160" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="854" y="150" width="256" height="136" fill="none" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="866" y="158" width="256" height="126" fill="none" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="860" y="164" width="248" height="126" fill="none" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="858" y="158" width="118" height="60" fill="#fef3c7" fill-opacity="0.92" stroke="#d97706" stroke-width="1.5"/>
    <rect x="996" y="158" width="118" height="60" fill="#dcfce7" fill-opacity="0.92" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="858" y="228" width="118" height="58" fill="#ede9fe" fill-opacity="0.92" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="996" y="228" width="118" height="58" fill="#ffe4e6" fill-opacity="0.92" stroke="#e11d48" stroke-width="1.5"/>
  </g>
  <text class="cap" x="840" y="322">old bounds faint behind; every cluster in the unit is rebuilt</text>

  <rect x="840" y="336" width="300" height="260" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" rx="4"/>
  <text class="fl" x="856" y="358">GOVERNED BY</text>
  <text class="b"  x="856" y="376"><tspan class="mono" font-weight="700">ClusterRepairExtentRatio</tspan> &#8212; 0.75</text>
  <text class="fl" x="856" y="416">FIRES WHEN</text>
  <text class="b"  x="856" y="434">a cluster&#8217;s widest axis passes</text>
  <text class="b"  x="856" y="450"><tspan class="mono">cellSize &#215; 0.75</tspan>. The cell is nominated,</text>
  <text class="b"  x="856" y="466">ranked, admitted only for a whole unit</text>
  <text class="fl" x="856" y="490">COSTS</text>
  <text class="b"  x="856" y="508">1 331 to 6 992 ns per entity, measured &#8212;</text>
  <text class="b"  x="856" y="524">and every entity in the unit moves</text>
  <text class="fl" x="856" y="548">WATCH</text>
  <text class="ctr" x="856" y="566">RepairUnitCount &#183; RepairedEntityCount</text>
  <text class="ctr" x="856" y="582">RepairUnitsRefused &#183; RepairValveFires</text>

  <!-- ══════════ cost scale ══════════ -->
  <line x1="40" y1="624" x2="1160" y2="624" stroke="#e4e4e7"/>
  <text class="lb" x="40" y="650">The cost of each response, in what it actually moves</text>

  <line x1="60" y1="748" x2="1140" y2="748" stroke="#a1a1aa" stroke-width="1.2"/>
  <rect x="100" y="738" width="180" height="10" fill="#16a34a" rx="2"/>
  <rect x="480" y="708" width="180" height="40" fill="#d97706" rx="2"/>
  <rect x="880" y="678" width="180" height="70" fill="#dc2626" rx="2"/>
  <text class="cost" x="100" y="728" fill="#15803d">nothing moves</text>
  <text class="cost" x="480" y="698" fill="#b45309">one entity moves</text>
  <text class="cost" x="880" y="668" fill="#b91c1c">a whole unit moves</text>
  <text class="cap"  x="100" y="766">a compare, per crossing</text>
  <text class="cap"  x="480" y="766">hundreds of nanoseconds, per drifter</text>
  <text class="cap"  x="880" y="766">microseconds per entity, for every entity in the unit</text>

  <!-- ══════════ note ══════════ -->
  <rect x="40" y="786" width="1120" height="82" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" rx="4"/>
  <text class="lb" x="60" y="810">Three thresholds on three different quantities. One ratio could never serve all three.</text>
  <text class="b"  x="60" y="832">Hysteresis measures how far past a <tspan font-weight="700">cell boundary</tspan> an entity sits. Drift measures how far outside its cluster&#8217;s <tspan font-weight="700">target region</tspan> it sits. Repair measures a cluster&#8217;s <tspan font-weight="700">extent</tspan> against the cell.</text>
  <text class="lm" x="60" y="856">The repair trigger has to live below 1.05, because a cluster whose entities all genuinely belong to its own cell tops out near 1 + the hysteresis ratio. Set at the outlier guard&#8217;s 1.2 it could never fire.</text>
</svg>
