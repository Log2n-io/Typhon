<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t   { font-size: 21px; font-weight: 700; fill: #18181b; }
    .st  { font-size: 13.5px; fill: #52525b; }
    .h   { font-size: 14.5px; font-weight: 700; fill: #18181b; }
    .lay { font-size: 13px; font-weight: 700; fill: #3f3f46; }
    .b   { font-size: 11.5px; fill: #3f3f46; }
    .lm  { font-size: 11.5px; fill: #71717a; }
    .lb  { font-size: 13px; font-weight: 700; fill: #3f3f46; }
    .mono{ font-size: 12px; font-family: ui-monospace, Consolas, monospace; fill: #18181b; }
    .cs  { font-size: 11px; font-family: ui-monospace, Consolas, monospace; fill: #52525b; }
    .cap { font-size: 11px; fill: #71717a; }
    .ok  { font-size: 11.5px; font-weight: 700; fill: #15803d; }
    .no  { font-size: 11.5px; font-weight: 700; fill: #b91c1c; }
  </style>
  <rect width="1200" height="800" fill="#ffffff"/>

  <text class="t"  x="40" y="38">Red and Black in three dimensions</text>
  <text class="st" x="40" y="60">The two-phase split colours cells by the parity of their coordinate sum. The sum has three terms, because the grid has three axes.</text>

  <!-- ══════════ heading + legend ══════════ -->
  <text class="h" x="40" y="94">A 3&#215;3&#215;3 neighbourhood, one layer per Z</text>
  <rect x="364" y="82" width="15" height="15" fill="#fee2e2" stroke="#dc2626"/>
  <text class="cap" x="386" y="94">Red &#8212; even sum</text>
  <rect x="486" y="82" width="15" height="15" fill="#e4e4e7" stroke="#52525b"/>
  <text class="cap" x="508" y="94">Black &#8212; odd sum</text>

  <text class="lay" x="60"  y="128">z = 0</text>
  <text class="lay" x="250" y="128">z = 1</text>
  <text class="lay" x="440" y="128">z = 2</text>

  <!-- z = 0 : sums 0 1 2 / 1 2 3 / 2 3 4 -->
  <g stroke-width="1">
    <rect x="60"  y="140" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="114" y="140" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="168" y="140" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="60"  y="194" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="114" y="194" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="168" y="194" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="60"  y="248" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="114" y="248" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="168" y="248" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g class="cs" text-anchor="middle">
    <text x="87" y="172">0</text><text x="141" y="172">1</text><text x="195" y="172">2</text>
    <text x="87" y="226">1</text><text x="141" y="226">2</text><text x="195" y="226">3</text>
    <text x="87" y="280">2</text><text x="141" y="280">3</text><text x="195" y="280">4</text>
  </g>

  <!-- z = 1 -->
  <g stroke-width="1">
    <rect x="250" y="140" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="304" y="140" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="358" y="140" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="250" y="194" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="304" y="194" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="358" y="194" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="250" y="248" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="304" y="248" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="358" y="248" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
  </g>
  <g class="cs" text-anchor="middle">
    <text x="277" y="172">1</text><text x="331" y="172">2</text><text x="385" y="172">3</text>
    <text x="277" y="226">2</text><text x="331" y="226">3</text><text x="385" y="226">4</text>
    <text x="277" y="280">3</text><text x="331" y="280">4</text><text x="385" y="280">5</text>
  </g>

  <!-- z = 2 -->
  <g stroke-width="1">
    <rect x="440" y="140" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="494" y="140" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="548" y="140" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="440" y="194" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="494" y="194" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="548" y="194" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="440" y="248" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="494" y="248" width="54" height="54" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="548" y="248" width="54" height="54" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g class="cs" text-anchor="middle">
    <text x="467" y="172">2</text><text x="521" y="172">3</text><text x="575" y="172">4</text>
    <text x="467" y="226">3</text><text x="521" y="226">4</text><text x="575" y="226">5</text>
    <text x="467" y="280">4</text><text x="521" y="280">5</text><text x="575" y="280">6</text>
  </g>

  <!-- six face neighbours, then the subject on top and inset so it stays distinct -->
  <g fill="none" stroke="#16a34a" stroke-width="3">
    <rect x="250" y="194" width="54" height="54"/>
    <rect x="358" y="194" width="54" height="54"/>
    <rect x="304" y="140" width="54" height="54"/>
    <rect x="304" y="248" width="54" height="54"/>
    <rect x="114" y="194" width="54" height="54"/>
    <rect x="494" y="194" width="54" height="54"/>
  </g>
  <rect x="358" y="248" width="54" height="54" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 3"/>
  <rect x="308" y="198" width="46" height="46" fill="none" stroke="#2563eb" stroke-width="3.5"/>

  <text class="cap" x="60" y="326">The <tspan fill="#1d4ed8" font-weight="700">blue</tspan> cell is (1, 1, 1), sum 3, Black. Its six face neighbours are ringed <tspan fill="#15803d" font-weight="700">green</tspan> &#8212; two along this</text>
  <text class="cap" x="60" y="343">layer&#8217;s row, two along its column, one directly below in z = 0 and one directly above in z = 2.</text>
  <text class="cap" x="60" y="366">Every one of them sums to an even number, so every one of them is Red. That is the whole</text>
  <text class="cap" x="60" y="383">property: no two face-adjacent cells ever run in the same phase.</text>
  <text class="cap" x="60" y="406" fill="#b91c1c">The dashed cell is (2, 2, 1), sum 5, Black &#8212; the same colour as the subject. A diagonal</text>
  <text class="cap" x="60" y="423" fill="#b91c1c">neighbour is <tspan font-weight="700">not</tspan> protected, and was never meant to be: it shares an edge, not a face.</text>

  <!-- ══════════ 2x2x2 block ══════════ -->
  <text class="h" x="40" y="464">The same rule on a 2&#215;2&#215;2 block</text>
  <text class="lay" x="60"  y="486">z = 0</text>
  <g stroke-width="1">
    <rect x="60"  y="494" width="48" height="48" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="108" y="494" width="48" height="48" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="60"  y="542" width="48" height="48" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="108" y="542" width="48" height="48" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g class="cs" text-anchor="middle"><text x="84" y="523">0</text><text x="132" y="523">1</text><text x="84" y="571">1</text><text x="132" y="571">2</text></g>

  <text class="lay" x="220" y="486">z = 1</text>
  <g stroke-width="1">
    <rect x="220" y="494" width="48" height="48" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="268" y="494" width="48" height="48" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="220" y="542" width="48" height="48" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="268" y="542" width="48" height="48" fill="#e4e4e7" stroke="#52525b"/>
  </g>
  <g class="cs" text-anchor="middle"><text x="244" y="523">1</text><text x="292" y="523">2</text><text x="244" y="571">2</text><text x="292" y="571">3</text></g>

  <text class="cap" x="350" y="512">Each layer is a checkerboard in its own plane, and</text>
  <text class="cap" x="350" y="530">the layer above is the exact inverse of the one</text>
  <text class="cap" x="350" y="548">below. Stepping one cell along <tspan font-weight="700">any</tspan> of the three</text>
  <text class="cap" x="350" y="566">axes changes the colour.</text>

  <!-- ══════════ right: the rule ══════════ -->
  <rect x="640" y="88" width="520" height="152" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" rx="4"/>
  <text class="lb"   x="658" y="112">The rule, as the code has it</text>
  <text class="mono" x="658" y="140">Red   = (cellX + cellY + cellZ) % 2 == 0</text>
  <text class="mono" x="658" y="162">Black = (cellX + cellY + cellZ) % 2 == 1</text>
  <text class="lm"   x="658" y="188">Exhaustive and disjoint over the filtered cluster set: every cluster lands in</text>
  <text class="lm"   x="658" y="205">exactly one phase. Two fallbacks &#8212; a cluster with no cell mapping goes to Red,</text>
  <text class="lm"   x="658" y="222">and an archetype with no grid puts everything in Red, which is single-phase.</text>

  <!-- ══════════ right: the 2D failure ══════════ -->
  <rect x="640" y="256" width="520" height="246" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" rx="4"/>
  <text class="lb" x="658" y="280">Why the two-dimensional form is wrong</text>
  <text class="lm" x="658" y="300">One column of three cells, all at (x, y) = (1, 1), stacked in Z.</text>

  <text class="mono" x="676" y="326" font-size="11.5">(cellX + cellY) % 2</text>
  <g stroke-width="1">
    <rect x="676" y="336" width="130" height="42" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="676" y="378" width="130" height="42" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="676" y="420" width="130" height="42" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g class="cs"><text x="688" y="362">z = 2  &#8594; Red</text><text x="688" y="404">z = 1  &#8594; Red</text><text x="688" y="446">z = 0  &#8594; Red</text></g>
  <text class="no" x="658" y="482">Face-adjacent, same phase. Broken.</text>

  <text class="mono" x="950" y="326" font-size="11.5">(cellX + cellY + cellZ) % 2</text>
  <g stroke-width="1">
    <rect x="950" y="336" width="140" height="42" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="950" y="378" width="140" height="42" fill="#e4e4e7" stroke="#52525b"/>
    <rect x="950" y="420" width="140" height="42" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g class="cs"><text x="962" y="362">z = 2  &#8594; Red</text><text x="962" y="404">z = 1  &#8594; Black</text><text x="962" y="446">z = 0  &#8594; Red</text></g>
  <text class="ok" x="1142" y="482" text-anchor="end">Adjacent in Z, opposite phase. Correct.</text>

  <!-- ══════════ right: why nobody noticed ══════════ -->
  <rect x="640" y="518" width="520" height="112" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" rx="4"/>
  <text class="lb" x="658" y="542">Why the wrong formula looked right for so long</text>
  <text class="b"  x="658" y="564">A flat world has <tspan class="mono" font-size="11">cellZ = 0</tspan> in every cell, so the Z term contributes</text>
  <text class="b"  x="658" y="582">nothing and the two formulas produce the identical split. Every</text>
  <text class="b"  x="658" y="600">two-dimensional workload agrees with both, and the grid only gained</text>
  <text class="b"  x="658" y="618">a third axis when the cell layer went sparse.</text>

  <!-- ══════════ bottom ══════════ -->
  <line x1="40" y1="656" x2="1160" y2="656" stroke="#e4e4e7"/>
  <rect x="40" y="676" width="1120" height="106" fill="#fafafa" stroke="#d4d4d8" rx="4"/>
  <text class="lb" x="60" y="700">What the split is for, and what it therefore has to guarantee</text>
  <text class="b"  x="60" y="722">A checkerboard system runs in two passes. Every cluster in the Red phase runs concurrently, then every cluster in the Black phase. That is safe only if no two cells</text>
  <text class="b"  x="60" y="740">that can touch each other are ever in the same pass, and the touching relation the dispatch relies on is <tspan font-weight="700">face adjacency</tspan> &#8212; the six neighbours, not the twenty-six.</text>
  <text class="lm" x="60" y="766">Publishing the two-term formula makes the guarantee false in Z while remaining true in a flat world, so the resulting bug would appear only after somebody built something tall.</text>
</svg>
