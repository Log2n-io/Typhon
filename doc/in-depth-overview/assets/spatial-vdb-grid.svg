<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t    { font-size: 21px; font-weight: 700; fill: #18181b; }
    .st   { font-size: 13.5px; fill: #52525b; }
    .h    { font-size: 14px; font-weight: 700; fill: #18181b; }
    .l    { font-size: 12px; fill: #3f3f46; }
    .lm   { font-size: 11.5px; fill: #71717a; }
    .lb   { font-size: 12.5px; font-weight: 700; fill: #3f3f46; }
    .mono { font-size: 11.5px; font-family: ui-monospace, Consolas, monospace; fill: #3f3f46; }
    .monos{ font-size: 10px; font-family: ui-monospace, Consolas, monospace; fill: #52525b; }
    .fld  { font-size: 10px; font-family: ui-monospace, Consolas, monospace; fill: #18181b; }
    .edge { font-size: 11px; font-style: italic; fill: #2563eb; }
    .th   { font-size: 12.5px; font-weight: 700; fill: #18181b; }
  </style>
  <rect width="1200" height="740" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  </defs>

  <text class="t"  x="40" y="38">The VDB cell grid &#8212; hash map over blocks, dense index inside a block, pooled cell state</text>
  <text class="st" x="40" y="60">Three indirections resolve a world position to a cell. Every one of them is paid only where something actually lives.</text>

  <!-- ══ 1 · world in blocks ══ -->
  <text class="h" x="40" y="106">1 &#183; The world, in blocks</text>
  <g stroke="#d4d4d8" stroke-dasharray="3 3" fill="#fafafa">
    <rect x="48" y="130" width="30" height="30"/><rect x="78" y="130" width="30" height="30"/><rect x="108" y="130" width="30" height="30"/><rect x="138" y="130" width="30" height="30"/>
    <rect x="168" y="130" width="30" height="30"/><rect x="198" y="130" width="30" height="30"/><rect x="228" y="130" width="30" height="30"/><rect x="258" y="130" width="30" height="30"/>
    <rect x="48" y="160" width="30" height="30"/><rect x="78" y="160" width="30" height="30"/><rect x="138" y="160" width="30" height="30"/><rect x="168" y="160" width="30" height="30"/>
    <rect x="228" y="160" width="30" height="30"/><rect x="258" y="160" width="30" height="30"/>
    <rect x="48" y="190" width="30" height="30"/><rect x="78" y="190" width="30" height="30"/><rect x="108" y="190" width="30" height="30"/><rect x="138" y="190" width="30" height="30"/>
    <rect x="168" y="190" width="30" height="30"/><rect x="198" y="190" width="30" height="30"/><rect x="228" y="190" width="30" height="30"/><rect x="258" y="190" width="30" height="30"/>
    <rect x="48" y="220" width="30" height="30"/><rect x="78" y="220" width="30" height="30"/><rect x="108" y="220" width="30" height="30"/><rect x="168" y="220" width="30" height="30"/>
    <rect x="198" y="220" width="30" height="30"/><rect x="258" y="220" width="30" height="30"/>
    <rect x="48" y="250" width="30" height="30"/><rect x="78" y="250" width="30" height="30"/><rect x="108" y="250" width="30" height="30"/><rect x="138" y="250" width="30" height="30"/>
    <rect x="168" y="250" width="30" height="30"/><rect x="198" y="250" width="30" height="30"/><rect x="228" y="250" width="30" height="30"/><rect x="258" y="250" width="30" height="30"/>
  </g>
  <rect x="108" y="160" width="30" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="198" y="160" width="30" height="30" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="138" y="220" width="30" height="30" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="228" y="220" width="30" height="30" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>

  <text class="lm" x="48" y="304">36 of the 40 blocks are absent.</text>
  <text class="lm" x="48" y="321">A dense grid would allocate all 40.</text>

  <!-- ══ 2 · root map ══ -->
  <path d="M 292 190 L 322 190" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="edge" x="292" y="182">hash</text>
  <text class="h" x="330" y="106">2 &#183; Root hash map</text>
  <rect x="330" y="130" width="196" height="150" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" rx="3"/>
  <text class="monos" x="342" y="150">ConcurrentHashMap&lt;long,int&gt;</text>
  <line x1="330" y1="158" x2="526" y2="158" stroke="#e4e4e7"/>
  <text class="monos" x="342" y="174">blockCoord</text><text class="monos" x="462" y="174">blockId</text>
  <rect x="336" y="182" width="184" height="22" fill="#dbeafe" stroke="#2563eb"/>
  <text class="mono" x="344" y="197">(2, 1, 0)</text><text class="mono" x="470" y="197">0</text>
  <text class="mono" x="344" y="223">(5, 1, 0)</text><text class="mono" x="470" y="223">1</text>
  <text class="mono" x="344" y="245">(3, 3, 0)</text><text class="mono" x="470" y="245">2</text>
  <text class="mono" x="344" y="267">(6, 3, 0)</text><text class="mono" x="470" y="267">3</text>

  <text class="lm" x="330" y="304">One entry per occupied block, packed</text>
  <text class="lm" x="330" y="321">into a <tspan class="monos">long</tspan> at 21 bits per axis.</text>

  <!-- ══ 3 · block index ══ -->
  <path d="M 530 190 L 566 190" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="edge" x="528" y="182">blockId</text>
  <text class="h" x="574" y="106">3 &#183; Inside block 0</text>
  <g stroke="#d4d4d8">
    <rect x="574" y="130" width="34" height="34" fill="#fafafa"/><rect x="608" y="130" width="34" height="34" fill="#fafafa"/><rect x="642" y="130" width="34" height="34" fill="#fafafa"/><rect x="676" y="130" width="34" height="34" fill="#fafafa"/>
    <rect x="574" y="164" width="34" height="34" fill="#fafafa"/><rect x="608" y="164" width="34" height="34" fill="#dbeafe"/><rect x="642" y="164" width="34" height="34" fill="#dbeafe"/><rect x="676" y="164" width="34" height="34" fill="#fafafa"/>
    <rect x="574" y="198" width="34" height="34" fill="#fafafa"/><rect x="608" y="198" width="34" height="34" fill="#dbeafe"/><rect x="642" y="198" width="34" height="34" fill="#dbeafe"/><rect x="676" y="198" width="34" height="34" fill="#dbeafe"/>
    <rect x="574" y="232" width="34" height="34" fill="#fafafa"/><rect x="608" y="232" width="34" height="34" fill="#fafafa"/><rect x="642" y="232" width="34" height="34" fill="#fafafa"/><rect x="676" y="232" width="34" height="34" fill="#fafafa"/>
  </g>
  <g class="monos" fill="#a1a1aa" text-anchor="middle">
    <text x="591" y="152">-1</text><text x="625" y="152">-1</text><text x="659" y="152">-1</text><text x="693" y="152">-1</text>
    <text x="591" y="186">-1</text><text x="693" y="186">-1</text>
    <text x="591" y="220">-1</text>
    <text x="591" y="254">-1</text><text x="625" y="254">-1</text><text x="659" y="254">-1</text><text x="693" y="254">-1</text>
  </g>
  <g class="fld" fill="#1d4ed8" text-anchor="middle" font-weight="700">
    <text x="625" y="186">7</text><text x="659" y="186">12</text>
    <text x="625" y="220">13</text><text x="659" y="220">19</text><text x="693" y="220">20</text>
  </g>
  <text class="lm" x="574" y="304">Dense <tspan class="monos">int[]</tspan> of cell-pool slots,</text>
  <text class="lm" x="574" y="321"><tspan class="monos">-1</tspan> where no cell exists.</text>
  <text class="lm" x="574" y="342">Drawn 4&#215;4. The shipped extent</text>
  <text class="lm" x="574" y="359">is derived per axis, as</text>
  <text class="lm" x="574" y="376"><tspan class="monos">clamp(nextPow2(cells), 1, 16)</tspan>.</text>

  <!-- ══ 4 · cell pool ══ -->
  <path d="M 714 190 L 754 190" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="edge" x="712" y="182">slot</text>
  <text class="h" x="780" y="106">4 &#183; The cell pool</text>
  <rect x="780" y="130" width="380" height="136" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" rx="3"/>
  <text class="monos" x="792" y="150">CellState &#8212; slot 7</text>

  <g stroke="#7c3aed" fill="#ede9fe">
    <rect x="790" y="158" width="38" height="34"/><rect x="828" y="158" width="38" height="34"/><rect x="866" y="158" width="38" height="34"/>
    <rect x="904" y="158" width="62" height="34"/><rect x="966" y="158" width="62" height="34"/>
    <rect x="1028" y="158" width="40" height="34"/><rect x="1068" y="158" width="40" height="34"/><rect x="1108" y="158" width="42" height="34"/>
  </g>
  <g class="fld" text-anchor="middle">
    <text x="809" y="179">Tier</text><text x="847" y="179">Flags</text><text x="885" y="179">Rsvd</text>
    <text x="935" y="174">Cluster</text><text x="935" y="186">Count</text>
    <text x="997" y="174">Entity</text><text x="997" y="186">Count</text>
    <text x="1048" y="179">CellX</text><text x="1088" y="179">CellY</text><text x="1129" y="179">CellZ</text>
  </g>
  <rect x="790" y="192" width="360" height="26" fill="#f4f4f5" stroke="#a1a1aa" stroke-dasharray="3 3"/>
  <text class="monos" x="880" y="209">bytes 24&#8211;63 &#8212; reserved / cache-line padding</text>

  <text class="lm" x="790" y="238">64 B, cache-line padded so two cells cannot false-share.</text>
  <text class="lm" x="790" y="255">Chunks of 256, appended and never moved.</text>

  <text class="lm" x="780" y="304">A cell key is a <tspan font-weight="700">pool slot</tspan>, not a coordinate. It carries no</text>
  <text class="lm" x="780" y="321">position, which is why the record stores its own, and it is</text>
  <text class="lm" x="780" y="338">not stable across a rebuild.</text>

  <!-- ══ comparison ══ -->
  <line x1="40" y1="400" x2="1160" y2="400" stroke="#e4e4e7"/>
  <text class="lb" x="40" y="426">What the shape costs and buys, against a dense grid of the same extent</text>

  <rect x="40" y="440" width="1120" height="30" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text class="th" x="386" y="460">A dense row-major grid</text>
  <text class="th" x="756" y="460">VDB grid</text>
  <g stroke="#e4e4e7"><rect x="40" y="470" width="1120" height="30" fill="#ffffff"/><rect x="40" y="500" width="1120" height="30" fill="#fafafa"/><rect x="40" y="530" width="1120" height="30" fill="#ffffff"/><rect x="40" y="560" width="1120" height="30" fill="#fafafa"/><rect x="40" y="590" width="1120" height="30" fill="#ffffff"/></g>
  <g class="l">
    <text x="56" y="490">Maximum extent</text>        <text x="386" y="490">128&#179; = 2.1 M cells, a hard cap</text>       <text x="756" y="490">21 bits per axis in the block key</text>
    <text x="56" y="520">An empty region costs</text>  <text x="386" y="520">a full <tspan class="mono">CellState</tspan> plus per-cell pools</text> <text x="756" y="520">one absent hash entry</text>
    <text x="56" y="550">Cell state at 2.1 M cells</text><text x="386" y="550">134 MB, allocated whatever the occupancy</text><text x="756" y="550">64 B &#215; occupied cells</text>
    <text x="56" y="580">Resolving one cell</text>     <text x="386" y="580">one array index</text>                       <text x="756" y="580">a hash probe plus two dependent loads</text>
    <text x="56" y="610">Reaching a neighbour</text>   <text x="386" y="610">arithmetic</text>                            <text x="756" y="610">arithmetic, while it stays inside the block</text>
  </g>

  <rect x="40" y="640" width="1120" height="86" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="4"/>
  <text class="lb" x="58" y="664">The saving is a function of occupancy, not a constant</text>
  <text class="l"  x="58" y="686">Measured at a 40&#179; grid with 20 % of cells occupied: 3.9 MiB for a dense grid against 1.2 MiB resident, a 3.2&#215; reduction. Projected to 1 % occupancy</text>
  <text class="l"  x="58" y="704">the same comparison is roughly 176 MiB against 10 MiB. A block holding one live cell still pays for its whole index array, so sparse worlds win by more.</text>
  <text class="lm" x="58" y="720">Read paths must never create a cell: a sweep that resolves-with-create materialises one per coordinate it touches, every answer stays correct, and the grid quietly goes dense again.</text>
</svg>
